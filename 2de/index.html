<style>/* Livret « Maths Allophones · Niveau 2 » — A4, impression couleur ou N&B */

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Andika','Noto Color Emoji',sans-serif;font-size:12pt;line-height:1.36;color:#1D2240;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.c-brand{--cc:#2B2D7C;--tt:#E6E8FA}
h1,h2,h3,h4,.ext,.num,.lv,.cv-title,.cv-sub,.cv-k,.cv-tome,.cv-n2,.gc-w,.az-w,.foot,.run,.ch-k,.qrbox,.tc,.hw b,.fam,.lab,.lab2,.sec-h,.cb-t,.me-t,.st-n,.pq-n,.calc-n{font-family:'Inter','Noto Color Emoji',sans-serif}
svg text{font-family:'Inter','Andika',sans-serif}
p{margin:1.2mm 0}
#flow{width:210mm}
.nw{white-space:nowrap}
/* fractions sur deux étages */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.02;margin:0 .1em;font-size:.88em;font-weight:700}
.fr .fn{padding:0 .18em .04em;border-bottom:.1em solid currentColor}
.fr .fd{padding:.04em .18em 0}
/* ---------- pages ---------- */
.page{width:210mm;height:297mm;position:relative;overflow:hidden;display:flex;flex-direction:column;page-break-after:always;break-after:page;background:#fff}
.page .inner{flex:1;overflow:hidden;padding:11mm 13mm 15mm}
.page.cont .inner{padding-top:4mm}
.run{margin:7mm 13mm 0;padding:1.4mm 4mm;border-radius:99px;background:var(--tt);color:var(--cc);font-weight:800;font-size:9.5pt}
.foot{position:absolute;left:13mm;right:13mm;bottom:6.5mm;display:flex;justify-content:space-between;align-items:center;font-size:8.5pt;color:#7d84a6}
.foot b{display:inline-grid;place-items:center;min-width:8mm;height:8mm;border-radius:99px;background:var(--tt,#E6E8FA);color:var(--cc,#2B2D7C);font-size:10pt}
.page.even .foot{flex-direction:row-reverse}
/* ---------- consignes ---------- */
strong.v{font-weight:700;text-decoration:underline;text-decoration-thickness:.11em;text-underline-offset:.17em;text-decoration-color:var(--cc,#2B2D7C)}
.cs{margin:.6mm 0 2mm}
.small{font-size:10.5pt}
.kc{color:var(--kc,var(--cc));font-weight:700}
.bl{display:inline-block;border-bottom:1.7px solid #1D2240;height:1.15em;vertical-align:-.2em;margin:0 .15em;position:relative}
.lines i{display:block;height:9.6mm;border-bottom:.5mm solid #A9B2D3;position:relative}
.lines{margin:.5mm 0 1.5mm}
/* ---------- blocs ---------- */
.blk{break-inside:avoid}
.ex{border:2px solid color-mix(in srgb,var(--cc) 30%,#fff);border-radius:5mm;padding:2.8mm 4mm 3.2mm;margin:0 0 3.6mm;background:#fff;position:relative}
.exh{display:flex;align-items:center;gap:2.4mm;margin-bottom:1.6mm}
.num{display:grid;place-items:center;width:8.2mm;height:8.2mm;border-radius:50%;background:var(--cc);color:#fff;font-weight:800;font-size:12pt;flex:none}
.lv{font-weight:800;font-size:9pt;padding:.7mm 2.6mm;border-radius:99px;white-space:nowrap}
.lv-1{background:#DCF4E4;color:#14572F}.lv-2{background:#FFF1CC;color:#6B4600}.lv-3{background:#E0EBFD;color:#173F86}
.lv-calc{background:#E0EBFD;color:#173F86}.lv-brevet{background:#FDE3E0;color:#8E1F18}.lv-redige{background:#FFE7D1;color:#7A3A00}
.lv-cherche{background:#FBE0EF;color:#7A1850}.lv-parle{background:#EEE3FB;color:#4F2390}.lv-sais{background:#D6F2F2;color:#05585C}.lv-defi{background:#FFF0B8;color:#5C4700}
.ext{font-weight:800;font-size:13pt;color:var(--cc)}
.exb{position:relative}
/* en-tête de chapitre */
.chead,.ghead{display:flex;gap:5mm;align-items:center;background:var(--tt);border-radius:7mm;padding:5mm 6mm;margin-bottom:3.5mm;position:relative;overflow:hidden}
.chead::after,.ghead::after{content:"";position:absolute;right:-14mm;top:-16mm;width:46mm;height:46mm;border-radius:50%;background:color-mix(in srgb,var(--cc) 14%,transparent)}
.ch-txt{flex:1;position:relative;z-index:1;min-width:0}
.ch-k{display:inline-block;background:var(--cc);color:#fff;font-weight:800;font-size:10pt;padding:.6mm 3.4mm;border-radius:99px}
.chead h2,.ghead h2{margin:1.6mm 0 1mm;font-weight:800;font-size:24pt;line-height:1.05;color:var(--cc);white-space:nowrap}
.chead p{margin:0;font-size:11.5pt}
.ghead h2{font-size:20pt}
.obj{margin:2mm 0 0;padding:0;list-style:none;font-size:11pt}
.obj li{margin:.5mm 0}.obj li::before{content:"🎯 "}
.glink{font-size:10pt;margin-top:1.6mm!important;color:#545B7A}
.qrbox{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1mm;background:#fff;border-radius:4mm;padding:2mm 2mm 1.4mm;border:2px solid var(--cc,#2B2D7C);flex:none;width:30mm;text-align:center;font-weight:800;font-size:8.2pt;line-height:1.15;color:var(--cc,#2B2D7C)}
.qrbox svg{width:25mm;height:25mm;display:block;shape-rendering:crispEdges}
.qrbox.big{width:38mm}.qrbox.big svg{width:32mm;height:32mm}
.qrbox.sm{width:24mm;font-size:7.4pt}.qrbox.sm svg{width:19mm;height:19mm}
/* mots de la leçon */
.mots h3,.notes h3{margin:0 0 1.6mm;font-size:12pt;font-weight:800;color:var(--cc)}
.mots{margin-bottom:3.6mm}
.chips{display:flex;flex-wrap:wrap;gap:1.6mm}
.chip{display:inline-block;border:1.6px solid var(--cc);background:var(--tt);border-radius:99px;padding:.3mm 2.8mm;font-size:10.5pt;font-weight:700;color:#1D2240;line-height:1.35}
.chip i{font-style:normal;font-weight:400;color:#545B7A}
/* ---------- cours ---------- */
.sec-h{display:flex;align-items:center;gap:2.4mm;margin:1mm 0 2.4mm;font-weight:800;font-size:15pt;color:var(--cc)}
.sec-h::after{content:"";flex:1;height:.7mm;border-radius:1mm;background:color-mix(in srgb,var(--cc) 35%,#fff)}
.sec-h .ic{display:grid;place-items:center;width:9mm;height:9mm;border-radius:2.6mm;background:var(--cc);color:#fff;font-size:12pt}
.cb{display:grid;grid-template-columns:1fr 44mm;gap:4mm;border:1.8px solid color-mix(in srgb,var(--cc) 35%,#fff);border-left:3.4mm solid var(--cc);border-radius:4mm;padding:2.8mm 3.6mm;margin-bottom:3mm;background:#fff}
.cb.noill{grid-template-columns:1fr}
.cb-t{margin:0 0 1mm;font-weight:800;font-size:12.5pt;color:var(--cc)}
.cb-n{display:inline-grid;place-items:center;width:6mm;height:6mm;border-radius:50%;background:var(--tt);color:var(--cc);font-size:9pt;margin-right:1.4mm;vertical-align:1px}
.cb-txt p{margin:.8mm 0;font-size:11.5pt}
.cb-ill{background:var(--tt);border-radius:3mm;padding:1mm;align-self:start}
.cb-ill svg{width:100%;height:auto;display:block}
.exm{background:#F4F7FE;border-radius:2.6mm;padding:1.4mm 3mm;margin-top:1.4mm;font-size:11pt}
.exm b{color:var(--cc);font-family:'Inter';font-size:9pt;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.exm p{margin:.4mm 0}
.att{background:#FFF6D8;border-left:2.4mm solid #FFC233;border-radius:2mm;padding:1.2mm 3mm;margin-top:1.4mm;font-size:11pt}
.tbl{border-collapse:collapse;margin:1mm 0 2mm}
.tbl td,.tbl th{border:1.5px solid #1D2240;padding:1.2mm 2.6mm;text-align:center}
.tbl th{background:var(--tt);text-align:left}
/* méthode */
.me{border:2px solid var(--cc);border-radius:5mm;padding:3mm 4mm;margin-bottom:3.4mm;background:#fff}
.me-t{margin:0 0 1.6mm;font-weight:800;font-size:13pt;color:var(--cc)}
.me-t span{display:inline-block;background:var(--cc);color:#fff;border-radius:99px;font-size:9pt;padding:.3mm 2.6mm;margin-right:2mm;vertical-align:2px}
ol.steps{list-style:none;margin:0 0 2mm;padding:0;counter-reset:st}
ol.steps li{counter-increment:st;display:flex;gap:2.4mm;align-items:flex-start;margin:1mm 0;font-size:11.5pt}
ol.steps li::before{content:counter(st);display:grid;place-items:center;flex:none;width:6.2mm;height:6.2mm;border-radius:50%;background:var(--tt);color:var(--cc);font:800 9.5pt 'Inter'}
.solved{background:#F4F7FE;border-radius:3.4mm;padding:2.4mm 3.4mm}
.solved h4{margin:0 0 1mm;font-size:10pt;font-weight:800;color:var(--cc);text-transform:uppercase;letter-spacing:.04em}
.solved .en{font-size:11.5pt;margin:0 0 1.6mm}
.sv{display:grid;grid-template-columns:1fr auto;gap:1.2mm 4mm;align-items:baseline}
.sv .t{font-size:11pt}.sv .c{font-weight:700;font-size:11.5pt;text-align:right;white-space:nowrap}
.solved .rep{margin-top:1.8mm;background:#DCF4E4;border-radius:2mm;padding:1mm 2.6mm;font-size:11.5pt}
.solved .ill{float:right;width:40mm;margin:0 0 1mm 3mm;background:#fff;border-radius:2mm}
.solved .ill svg{width:100%;height:auto;display:block}
/* Relie */
.rel{display:grid;grid-template-columns:auto minmax(12mm,1fr) auto;row-gap:2.2mm;align-items:center}
.rl,.rr{display:flex;align-items:center;gap:2mm;position:relative}
.rr{justify-self:start}
.dot{width:3.2mm;height:3.2mm;border-radius:50%;background:#1D2240;flex:none}
.lab,.lab2{display:inline-grid;place-items:center;width:5mm;height:5mm;border-radius:1.4mm;font-weight:800;font-size:8.5pt;background:#EEF3FF;color:#545B7A;flex:none}
.lab2{margin-right:1.6mm}
.il{display:inline-block}.il svg{width:100%;height:100%;display:block}
.rw{display:inline-flex;align-items:center;font-weight:700;font-size:12pt}
.rel-def{grid-template-columns:auto 12mm 1fr}
.rel-def .rw{color:var(--cc);gap:1.6mm}
.rel-def .rd{display:flex;align-items:flex-start;font-size:10.5pt;line-height:1.28}
/* Banque d’étiquettes */
.bank{display:flex;flex-wrap:wrap;gap:2mm;padding:2mm;border:1.6px dashed var(--cc);border-radius:3mm;margin-bottom:2.4mm}
.tag{background:var(--tt);border-radius:2mm;padding:.4mm 2.4mm;font-weight:700}
/* sous l’image */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm 4mm}
.sg{display:flex;flex-direction:column;gap:1.2mm}
.sg-ill{width:100%;height:24mm;background:#F6F8FE;border-radius:2.5mm;border:1px solid #E1E6F5;padding:.6mm}
.sg .bl{width:100%;margin:0;height:7mm}
/* Trous */
.gaps{display:grid;grid-template-columns:1fr 1fr;gap:2.6mm 6mm}
.gp{display:grid;grid-template-columns:21mm 1fr;gap:3mm;align-items:center}
.gp-ill{width:21mm;height:15mm;background:#F6F8FE;border-radius:2mm;border:1px solid #E1E6F5}
.gs{margin:0;font-size:11.5pt;line-height:1.45}
.hint{margin:.4mm 0 0;font-size:9.5pt;color:#6b7395;letter-spacing:.02em}
/* énoncés */
.enonce{background:#FFF6D8;border-left:3mm solid #FFC233;border-radius:2.5mm;padding:2mm 3.6mm;margin:1mm 0 2mm;font-size:11.5pt}
.enonce p{margin:.4mm 0}
.citem{margin:0 0 2.6mm;padding-bottom:2.2mm;border-bottom:1px dotted #C9D1EA}
.citem:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.citem .q{font-weight:700;margin:.6mm 0 1mm}
.opts{display:flex;flex-wrap:wrap;gap:1.6mm 5mm}
.opt{display:inline-flex;align-items:center;gap:1.4mm;font-size:11.5pt;position:relative}
.box{position:relative;display:inline-block}
.opt .box{font-size:13pt;line-height:1}
.vfs{display:flex;gap:6mm}
.tg{position:relative}
.sent{display:block;margin:.3mm 0}
/* calculs */
.calcs{display:grid;grid-template-columns:1fr 1fr;gap:3mm 5mm}
.calc{border:1.4px solid #DCE2F2;border-radius:3mm;padding:2mm 2.8mm 2mm 7mm;display:flex;flex-direction:column;gap:1mm;position:relative}
.calc.wide{grid-column:1/-1}
.calc-n{position:absolute;left:1mm;top:1.8mm;display:grid;place-items:center;width:5.6mm;height:5.6mm;border-radius:50%;background:var(--tt);color:var(--cc);font-size:8.5pt;font-weight:800;border:1.2px solid var(--cc)}
.calc .ct{font-size:11pt;line-height:1.32}
.calc .ct p{margin:.2mm 0}
.calc.hasfig{display:grid;grid-template-columns:1fr 27mm;gap:2mm;align-items:start}
.calc.wide.hasfig{grid-template-columns:1fr 40mm}
.calc.hasscr{display:grid;grid-template-columns:1fr 72mm;gap:3mm;align-items:start}
.cm{display:flex;flex-direction:column;gap:1mm;min-width:0;height:100%}
.calc .fig svg{width:100%;height:auto;display:block}
.ans{display:flex;align-items:flex-end;gap:1.6mm;font-size:10.5pt;color:#545B7A;margin-top:auto}
.ans .bl{flex:1;min-width:14mm}
.ans .u{color:#1D2240;font-weight:700}
.work{height:13mm;border:1px dashed #C9D1EA;border-radius:2mm;margin:.6mm 0;position:relative}
.frb{display:inline-flex;flex-direction:column;align-items:center;gap:.6mm;vertical-align:middle}
.frb i{display:block;width:13mm;height:6.6mm;border:1.4px solid #1D2240;border-radius:1mm;position:relative}
.frb hr{width:16mm;margin:0;border:0;border-top:1.6px solid #1D2240}
/* brevet */
.pbm .figr{float:right;width:52mm;margin:0 0 2mm 3mm;background:#fff}
.pbm .figr svg{width:100%;height:auto;display:block}
.pq{margin:2mm 0 0;clear:none}
.pq-h{display:flex;gap:2mm;align-items:baseline}
.pq-n{display:inline-grid;place-items:center;flex:none;width:6.4mm;height:6.4mm;border-radius:1.8mm;background:var(--cc);color:#fff;font-size:9.5pt;font-weight:800}
.pq-q{font-size:11.5pt;font-weight:700}
.pl{display:flex;gap:2mm;align-items:flex-start;font-size:10pt;color:#545B7A;margin:.6mm 0 0}
.pl>span:first-child{min-width:20mm;padding-top:4.6mm}
.pl .lines{flex:1;margin:0}
.pouce{clear:both;margin-top:2.4mm;border:1.4px dashed #A9B2D3;border-radius:2.6mm;padding:1.2mm 3mm;font-size:9.5pt;color:#454c6e;background:#FAFBFF}
.pouce b{font-family:'Inter';font-weight:800;color:#545B7A}
.pouce span{display:inline-block;margin-right:3mm}
/* rédaction */
.rdg{margin:0 0 2.6mm}
.rdg .calcd{font-weight:700;font-size:11pt;color:#2d3356;margin:.4mm 0 .8mm;padding-left:3mm;border-left:1.2mm solid var(--tt)}
ul.starters{list-style:none;display:flex;flex-wrap:wrap;gap:1.6mm;padding:0;margin:0 0 1mm}
ul.starters li{background:var(--tt);border-radius:99px;padding:.4mm 3mm;font-size:11pt}
ul.starters li::before{content:"✏️ "}
/* ordre */
.ord{margin-bottom:1.6mm}
/* parler */
.parle{display:grid;grid-template-columns:1fr 31mm;gap:4mm;align-items:start}
ol.keys{margin:0 0 2mm;padding-left:6mm;font-size:11.5pt}ol.keys li{margin:.6mm 0}
.amorces{display:flex;flex-wrap:wrap;gap:1.6mm}
.amorces span{border:1.5px solid var(--cc);border-radius:99px;padding:.2mm 2.6mm;font-size:10.5pt;background:#fff}
/* bilan */
table.sais{border-collapse:collapse;width:100%}
table.sais td{padding:1mm 0;border-bottom:1px dotted #C9D1EA;font-size:11.5pt}
table.sais td:last-child{text-align:right;white-space:nowrap}
.face{width:9.5mm;height:9.5mm;margin-left:2.4mm;vertical-align:middle}
.ex.sais{background:#F4FBFB}
.notes{margin-top:1mm}
/* mots croisés */
.cw{display:grid;grid-template-columns:auto 1fr;gap:5mm;align-items:start}
.cwg{position:relative}
.cwc{position:absolute;width:6.6mm;height:6.6mm;border:1.2px solid #1D2240;background:#fff;margin:-.6px 0 0 -.6px}
.cwn{position:absolute;left:.4mm;top:.1mm;font:800 5.6pt 'Inter';color:#545B7A}
.cwl{display:none}
.cwclues{font-size:10pt;line-height:1.28}
.cwclues h4{margin:0 0 .8mm;font-size:10.5pt;color:var(--cc)}
.cwclues ul{list-style:none;margin:0 0 2mm;padding:0}.cwclues li{margin:.6mm 0}
.cnt{color:#7d84a6;font-size:8.5pt}
/* mots mêlés */
.mmw{display:grid;grid-template-columns:auto 1fr;gap:6mm;align-items:start}
.mmg{display:grid;grid-template-columns:repeat(12,6.4mm);border:1.6px solid #1D2240;border-radius:2mm;padding:1mm}
.mm{display:grid;place-items:center;width:6.4mm;height:6.4mm;font:700 10.5pt 'Inter';color:#1D2240}
.prof .mm.ok{color:#D0021B;background:#FDE3E0}
ul.mml{list-style:none;margin:0;padding:0;font-size:11.5pt;font-weight:700}ul.mml li{margin:1.4mm 0}
/* ---------- pages fixes ---------- */
.pg-t{font-weight:800;font-size:22pt;color:#2B2D7C;margin:2mm 0 4mm}
.pg-s{font-weight:800;font-size:14pt;color:#2B2D7C;margin:5mm 0 2mm}
.pg-p{margin:1mm 0 2mm}
.howto{display:grid;gap:2mm}
.hw{display:grid;grid-template-columns:13mm 34mm 1fr;align-items:center;background:#F3F6FE;border-radius:4mm;padding:2mm 4mm}
.hw .hi{font-size:19pt}.hw b{font-weight:800;font-size:12.5pt;color:#2B2D7C}
.lvls{display:flex;flex-wrap:wrap;gap:2.4mm}.lvls .lv{font-size:11pt;padding:1.2mm 3.6mm}
.legend{display:flex;flex-wrap:wrap;gap:2mm}
.qrhow{display:grid;grid-template-columns:32mm 1fr;gap:6mm;align-items:center}
.qrhow ol{margin:0;padding-left:6mm}.qrhow li{margin:1mm 0}
.toc{display:grid;gap:1.2mm;margin-bottom:2mm}
.tc{display:flex;align-items:center;gap:3mm;background:var(--tt);border-radius:3.4mm;padding:.9mm 4mm;font-weight:800;font-size:11pt}
.tn{display:grid;place-items:center;width:6.6mm;height:6.6mm;border-radius:50%;background:var(--cc);color:#fff;font-weight:800;font-size:10pt;flex:none}
.tt{color:var(--cc)}.tdots{flex:1;border-bottom:2px dotted color-mix(in srgb,var(--cc) 45%,#fff);margin:0 2mm 1.6mm}
.tp{font-weight:800;color:var(--cc);min-width:8mm;text-align:right}
.tc.rv{margin-left:8mm;font-size:10pt}
table.phr2{width:100%;border-collapse:separate;border-spacing:0 1.4mm;font-size:10.8pt}
table.phr2 th{font-family:'Inter';font-weight:800;color:#fff;background:#2B2D7C;padding:1.6mm 3mm;text-align:left;font-size:10pt}
table.phr2 th:first-child{background:none}
table.phr2 th span{font-weight:700;opacity:.8}
table.phr2 td{background:#F3F6FE;padding:1.5mm 3mm;vertical-align:middle}
table.phr2 td.pk{background:#FFF6D8;font-family:'Inter';font-weight:800;font-size:9.5pt;color:#6B4600;width:36mm}
table.phr2 td.pk span{font-size:13pt;margin-right:1.6mm}
.jst{display:grid;grid-template-columns:1fr 1fr;gap:2mm 5mm}
.jst div{background:#EEF8F1;border-left:2.4mm solid #1E7F45;border-radius:0 2.4mm 2.4mm 0;padding:1.2mm 3mm;font-size:11pt}
.jst div b{display:block;font-family:'Inter';font-weight:800;font-size:9pt;color:#14572F}
table.nw{width:100%;border-collapse:collapse;margin-top:3mm}
table.nw th{background:#E6E8FA;color:#2B2D7C;font-family:'Inter';font-weight:800;padding:2mm;border:1.5px solid #9aa3c7}
table.nw td{height:14mm;border:1.5px solid #C9D1EA}
/* formulaire */
.fm{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.fb{border:1.8px solid color-mix(in srgb,var(--cc) 40%,#fff);border-top:3mm solid var(--cc);border-radius:3.4mm;padding:2mm 3.2mm;break-inside:avoid}
.fb h3{margin:0 0 1.2mm;font-size:11.5pt;font-weight:800;color:var(--cc)}
.fb table{border-collapse:collapse;width:100%;font-size:10.4pt}
.fb td{padding:.7mm 1mm;border-bottom:1px dotted #D6DDF0;vertical-align:middle}
.fb td:last-child{font-weight:700;text-align:right}
.fb td:first-child{padding-right:2mm}
.fb.span{grid-column:1/-1}
.fb p{margin:.6mm 0;font-size:10.4pt}
/* ---------- couverture ---------- */
.cover .inner{padding:12mm 13mm 12mm;display:flex;flex-direction:column;gap:6mm}
.author{position:absolute;top:6.5mm;right:13mm;font-family:'Inter';font-weight:800;font-size:9pt;color:#545B7A;letter-spacing:.03em}
.cv-panel{position:relative;background:#2B2D7C;border-radius:11mm;height:168mm;overflow:hidden;color:#fff;padding:18mm 14mm 0;margin-top:3mm}
.cv-panel::before{content:"";position:absolute;width:120mm;height:120mm;border-radius:50%;background:#4446B8;right:-42mm;top:-38mm}
.cv-panel::after{content:"";position:absolute;width:70mm;height:70mm;border-radius:50%;background:#FFC233;left:-22mm;bottom:-30mm;opacity:.95}
.cv-k,.cv-title,.cv-sub,.cv-tome,.cv-n2{position:relative;z-index:2}
.cv-k{font-weight:800;font-size:12pt;color:#FFC233;letter-spacing:.22em;text-transform:uppercase}
.cv-title{font-weight:800;font-size:68pt;line-height:.95;letter-spacing:.02em;margin:2mm 0 1mm}
.cv-n2{display:inline-block;background:#fff;color:#2B2D7C;font-weight:800;font-size:17pt;border-radius:99px;padding:1mm 5mm;margin:1mm 0 3mm}
.cv-sub{font-weight:800;font-size:19pt;line-height:1.15}
.cv-tome{display:inline-block;margin-top:5mm;background:#FFC233;color:#3F2A00;font-weight:800;font-size:13pt;padding:2mm 6mm;border-radius:99px}
.cv-fam{position:absolute;z-index:2;left:50mm;bottom:9mm;display:flex;gap:2.4mm}
.fam{display:grid;place-items:center;width:11.5mm;height:11.5mm;border-radius:50%;background:var(--tt);border:2.2px solid var(--cc);font-size:14pt}
.dc{position:absolute;z-index:2;width:36mm;height:25mm;background:#fff;border-radius:5mm;padding:1.2mm;box-shadow:0 1.2mm 0 rgba(0,0,0,.18)}
.dc svg{width:100%;height:100%}
.d0{right:9mm;top:12mm;transform:rotate(6deg)}.d1{right:11mm;top:46mm;transform:rotate(-5deg)}
.d2{right:8mm;top:80mm;transform:rotate(4deg)}.d3{right:12mm;top:114mm;transform:rotate(-6deg)}.d4,.d5{display:none}
.cv-id{display:grid;grid-template-columns:1fr auto;gap:8mm;align-items:center;border:2.5px solid #2B2D7C;border-radius:8mm;padding:6mm 7mm}
.cv-classe{grid-column:1/-1;font-family:'Inter';font-weight:800;font-size:14pt;color:#545B7A;margin-bottom:-3mm}
.cv-classe b{font-weight:800;font-size:19pt;color:#2B2D7C;background:#FFC233;border-radius:3mm;padding:0 3mm;margin-left:1mm}
.cv-fields{display:grid;gap:4.4mm}
.cv-fields div{display:flex;align-items:flex-end;gap:3mm}
.cv-fields span{font-family:'Inter';font-weight:800;font-size:12pt;color:#2B2D7C;min-width:34mm}
.cv-fields i{flex:1;border-bottom:2px dashed #9aa3c7;height:8mm}
/* ---------- glossaire ---------- */
.gcard{display:grid;grid-template-columns:31mm 1fr;gap:4mm;border:1.8px solid color-mix(in srgb,var(--cc) 45%,#fff);border-left:3.2mm solid var(--cc);border-radius:4mm;padding:2.6mm 3.4mm;margin-bottom:2.8mm;background:#fff}
.gc-ill{background:var(--tt);border-radius:3mm;height:22mm;padding:.8mm}
.gc-ill svg{width:100%;height:100%;display:block}
.gc-h{display:flex;align-items:baseline;gap:2mm;flex-wrap:wrap}
.gc-w{font-weight:800;font-size:15pt;color:var(--cc);line-height:1.1}
.gc-w i{font-style:normal;font-weight:700;color:#545B7A}
.sym{display:inline-block;background:var(--tt);border-radius:1.6mm;padding:0 1.8mm;font-size:11.5pt}
.ctx{font-size:10pt;color:#545B7A}
.gc-cat{margin-left:auto;font-size:8.5pt;font-weight:700;color:var(--cc)}
.gc-def{margin:.8mm 0 .6mm;font-size:11pt;line-height:1.3}
.forms{display:flex;flex-wrap:wrap;gap:1.4mm;margin:.6mm 0}
.forms span{font-size:9.5pt;background:var(--tt);border-radius:99px;padding:0 2.6mm}
.gc-ph{margin:.4mm 0 0;padding-left:5mm;font-size:10.3pt;line-height:1.3;color:#2d3356}
.dire,.note{font-size:9.5pt;margin:.6mm 0 0;color:#2d3356}
.ml{display:flex;gap:2mm;font-size:9.5pt;margin-top:1.4mm;color:#545B7A}.ml i{flex:1;border-bottom:1.4px dashed #A9B2D3}
.sample{margin:2mm 0 3mm}
ul.annot{list-style:none;padding:0;margin:0 0 2mm;display:grid;grid-template-columns:1fr 1fr;gap:1.4mm 6mm;font-size:11pt}
.az-l{margin:1.6mm 0 1.4mm}

.palh{display:flex;align-items:center;gap:2.4mm;margin:1mm 0 2.6mm;padding:1.6mm 3.4mm;border-radius:3mm;background:var(--tt);color:#1D2240;font-size:10.5pt}
.palh b{font:800 12pt 'Inter';color:var(--cc)}
.palh .pal{background:#fff}
.exh .cps{display:inline-flex;flex-wrap:wrap;gap:1mm;margin-left:auto}
.exh .ext{flex:1 1 auto;min-width:0}
.ex .q{margin:1.6mm 0 .6mm;font-size:11pt}
.ex .q .qn,.act .q .qn{font:800 10pt 'Inter';color:var(--cc);margin-right:1.4mm}
.act .q{margin:1.6mm 0 .6mm;font-size:11pt}
p.ans{display:flex;align-items:flex-end;gap:1.6mm;margin:.4mm 0 1.2mm;font-size:10.5pt;color:#545B7A}
p.ans .bl{flex:none}
.pouce-r{margin-top:1.6mm;font:700 8.4pt 'Inter';color:#7d84a6;text-align:right}
.wfull{width:100%}
.tbl td.tl,.tbl th.tl{text-align:left}
.tbl.tnum td,.tbl.tnum th{font-size:10.2pt}
.tbl.tnum td.fill{height:7.6mm;min-width:16mm}
.tbl.vf td{border:none;border-bottom:1px dotted #C9D1EA;padding:1.2mm 2mm;font-size:10.8pt}
.tbl.vf{border:none;width:100%}
.tbl.bilan{width:100%;font-size:10.2pt}.tbl.bilan th{text-align:center;font-size:9.4pt}.tbl.bilan td{padding:1.2mm 2mm}
/* « Je me souviens » */
.jms{border:2px solid var(--cc);border-radius:5mm;padding:2.4mm 4mm 3mm;margin-bottom:3.4mm;background:#fff}
.jms-h{font:800 13pt 'Inter';color:var(--cc);margin-bottom:2mm}
.jms-h span{font:700 9pt 'Inter';color:#545B7A;margin-left:2mm}
.jms-g{display:grid;grid-template-columns:1fr 1fr;gap:2mm 6mm}
.jms-i{display:flex;align-items:flex-end;gap:1.6mm;font-size:11pt;border-bottom:1px dotted #DCE2F2;padding-bottom:1mm}
.jms-n{display:inline-grid;place-items:center;width:5.4mm;height:5.4mm;border-radius:50%;background:var(--tt);color:var(--cc);font:800 8.4pt 'Inter';flex:none;align-self:center}
.jms-q{flex:none}
/* activités */
.act{border:2px solid color-mix(in srgb,var(--cc) 40%,#fff);border-radius:5mm;margin-bottom:3.4mm;overflow:hidden;background:#fff}
.act-h{display:flex;align-items:center;gap:2.4mm;flex-wrap:wrap;background:var(--tt);padding:1.8mm 4mm}
.act-n{background:var(--cc);color:#fff;font:800 9.5pt 'Inter';border-radius:99px;padding:.4mm 3mm}
.act-t{font:800 12.5pt 'Inter';color:var(--cc);flex:1}
.act-b{padding:2mm 4mm 3mm;font-size:11pt}
.sec-sub{margin-left:auto;font:700 8.6pt 'Inter';color:#7d84a6;order:3}
.sec-h::after{order:2}
/* cours : L’essentiel / Autrement dit */
.duo2{display:grid;grid-template-columns:1.12fr 1fr;gap:2.4mm}
.duo2.withill{grid-template-columns:1.12fr 1fr 38mm}
.ess,.ad{border-radius:3mm;padding:1.4mm 2.6mm;font-size:10.4pt;line-height:1.3}
.ess{background:#F4F6FC;border:1.4px solid color-mix(in srgb,var(--cc) 30%,#fff)}
.ad{background:#FAFBFE;border:1.4px dashed #C9D1EA;color:#2d3356}
.ess p,.ad p{margin:.5mm 0}
.tg-e,.tg-a{display:inline-block;font:800 7.8pt 'Inter';text-transform:uppercase;letter-spacing:.05em;border-radius:99px;padding:.2mm 2.4mm;margin-bottom:.6mm}
.tg-e{background:var(--cc);color:#fff}.tg-a{background:#fff;color:var(--cc);border:1.3px solid var(--cc)}
.cb3 .cill{display:flex;align-items:center}
.tbl.tvat{width:100%;font-size:9.6pt;margin:1.6mm 0 .4mm}.tbl.tvat td,.tbl.tvat th{text-align:left;padding:.8mm 2mm;border:1px solid #C9D1EA}.tbl.tvat td:last-child,.tbl.tvat th:last-child{text-align:center;width:14mm}
.srcl{margin:.4mm 0 0;font:700 7.6pt 'Inter';color:#7d84a6}
.cbig{max-width:150mm}
/* encart juridique */
.enc{border:2px solid #2B2D7C;border-radius:4mm;background:#F5F6FD;margin-bottom:3mm;overflow:hidden}
.enc-h{background:#2B2D7C;color:#fff;font:800 11pt 'Inter';padding:1.4mm 4mm}
.enc-b{padding:1.6mm 4mm;font-size:10.4pt}.enc-b p{margin:.6mm 0}
.enc-s{padding:0 4mm 1.6mm;font:700 7.6pt 'Inter';color:#545B7A}
/* méthodes */
.me-sheet{margin:1mm 0 2mm}.me-sheet p{margin:.8mm 0 0}
/* ---------- documents ---------- */
.docx{border:1.4px solid #B9C2DE;border-radius:2.6mm;background:#fff;margin:1mm 0 2mm;overflow:hidden;break-inside:avoid}
.docx-h{display:flex;align-items:baseline;gap:2mm;background:#EEF1F8;padding:.9mm 3mm;border-bottom:1px solid #D6DDF0}
.docx-n{font:800 8.4pt 'Inter';color:#fff;background:#545B7A;border-radius:99px;padding:.1mm 2.2mm}
.docx-t{font:800 9.6pt 'Inter';color:#1D2240}
.docx-b{padding:1.4mm 3mm;font-size:10.2pt}.docx-b p{margin:.5mm 0}
.docx-s{padding:0 3mm 1.2mm;font:700 7.4pt 'Inter';color:#7d84a6}
table.dt{border-collapse:collapse;width:100%;font-size:9.6pt}
table.dt th{background:#F4F6FC;font:800 8.4pt 'Inter';color:#545B7A;text-align:left;padding:.8mm 1.6mm;border-bottom:1.4px solid #B9C2DE}
table.dt td{padding:.8mm 1.6mm;border-bottom:1px solid #E1E6F5}
table.dt td:nth-child(n+2){text-align:right}
table.dt.dt-kv thead{display:none}table.dt.dt-kv td:first-child{color:#545B7A}table.dt.dt-kv td:last-child{font-weight:700}
table.dt .cellans{min-width:16mm;min-height:5mm}
/* ticket de caisse */
.tk{font-family:'DejaVu Sans Mono',monospace;font-size:7.9pt;line-height:1.35;background:#fff;border:1px solid #C9D1EA;border-radius:1.4mm;padding:2.6mm 3mm;box-shadow:0 .8mm 0 #E1E6F5;max-width:72mm;margin:0 auto}
.tk-head{text-align:center}.tk-head b{display:block;font-size:9.4pt;letter-spacing:.06em}
.tk-sep{border-top:1px dashed #8A93B5;margin:1.4mm 0}
.tk-l{display:grid;grid-template-columns:1fr auto 5mm;gap:2mm}.tk-l span:nth-child(2){text-align:right}.tk-l span:nth-child(3){text-align:right;color:#545B7A}
.tk-l small{display:block;color:#545B7A;font-size:7pt}
.tk-tot{display:flex;justify-content:space-between;font-weight:700;font-size:9pt}
table.tk-t{width:100%;border-collapse:collapse;font-size:7.4pt}
table.tk-t th{font-weight:700;text-align:right;border-bottom:1px solid #8A93B5}table.tk-t th:first-child,table.tk-t td:first-child{text-align:left}
table.tk-t td{text-align:right;padding:.6mm 0;height:5.4mm}
table.tk-t .cellans{display:inline-block;min-width:11mm;border-bottom:1.2px solid #1D2240;min-height:4mm}
.tk-foot{text-align:center;margin-top:1.4mm;color:#545B7A;font-size:7pt}
/* étiquette de rayon */
.et{position:relative;border:1.4px solid #1D2240;border-radius:1.6mm;background:#FFF9D9;padding:1.6mm 2.4mm;max-width:60mm;margin:1mm auto;box-shadow:0 .6mm 0 #E8D98C}
.et-n{font:800 9.4pt 'Inter';text-transform:uppercase;color:#1D2240}
.et-d{font-size:8.6pt;color:#545B7A}
.et-p{font:800 19pt 'Inter';color:#C2332A;text-align:right;line-height:1.1}
.et-k{font-size:7.8pt;text-align:right;color:#1D2240;border-top:1px solid #E1D58E;margin-top:.6mm;padding-top:.4mm}
.et-b{position:absolute;left:2.4mm;bottom:6.4mm;background:#C2332A;color:#fff;font:800 7.6pt 'Inter';border-radius:99px;padding:0 2mm}
.et-q{color:#A9B2D3;letter-spacing:.1em}
.etiqs{display:flex;flex-direction:column;gap:2mm}
/* feuille de tableur */
.sh{border:1.2px solid #B9C2DE;border-radius:1.6mm;overflow:hidden;background:#fff;font-family:'DejaVu Sans',sans-serif;font-size:8.6pt;margin:1mm 0 2mm}
.sh-fx{display:flex;align-items:center;gap:2mm;padding:.8mm 2mm;border-bottom:1px solid #C9D1EA;background:#F7F8FC}
.sh-ref{min-width:10mm;font-weight:700;color:#1D2240;border-right:1px solid #C9D1EA;padding-right:2mm}
.sh-f{font-style:italic;color:#7d84a6}.sh-v{color:#14572F;min-height:3.6mm}
table.sh-t{border-collapse:collapse;width:100%}
table.sh-t th{background:#E9ECF5;color:#545B7A;font-weight:600;border:1px solid #C9D1EA;padding:.5mm 1.6mm;font-size:8pt}
table.sh-t tr th:first-child{width:6mm}
table.sh-t td{border:1px solid #D6DDF0;padding:.6mm 1.6mm;text-align:right;height:5.6mm}
table.sh-t td.sh-h{font-weight:700;background:#F4F6FC;text-align:center}
table.sh-t td.sh-txt{text-align:left}
table.sh-t td.sh-sel{outline:2px solid #1E7F45;outline-offset:-2px}
/* message */
.ms{border-radius:4mm;background:#F2F5FC;padding:2mm 3mm;font-size:10.2pt}
.ms-h{display:flex;align-items:center;gap:2mm;margin-bottom:1mm}.ms-h small{display:block;font-size:7.8pt;color:#7d84a6}
.ms-av{display:grid;place-items:center;width:7mm;height:7mm;border-radius:50%;background:#2B2D7C;color:#fff;font:800 9pt 'Inter'}
.ms-b{background:#fff;border-radius:3mm;padding:1.6mm 2.6mm;border:1px solid #DCE2F2}
/* affiche promo */
.pr{background:#1D2240;color:#fff;border-radius:3mm;padding:3mm 4mm;text-align:center;position:relative;max-width:62mm;margin:2mm auto}
.pr-k{font:800 8pt 'Inter';letter-spacing:.12em;color:#FFC233}
.pr-t{font:800 11pt 'Inter';margin:1mm 0}
.pr-p{font:800 24pt 'Inter';color:#FFC233;line-height:1.05}
.pr-o{font-size:10pt;text-decoration:line-through;opacity:.8}
.pr-s{position:absolute;right:-2mm;top:-3mm;background:#C2332A;color:#fff;font:800 12pt 'Inter';border-radius:99px;padding:1mm 3mm;transform:rotate(8deg)}
/* code Python */
pre.code.py{font-size:8.6pt;margin:1mm 0}
pre.code.py b{color:#FFC233;font-weight:700}pre.code.py i{color:#9AD4B0;font-style:normal}
/* situation */
.sit-b{grid-template-columns:1fr 62mm}
.sit-d .docx{margin-top:0}
.docx-sm .docx-b{padding:1mm 2mm}
table.dt.dt-sm{font-size:8.4pt}
/* exercice type bac */
.ex.bac{border-color:#f0a8a3}
.bacline{font:800 9.6pt 'Inter';color:#8E1F18;margin:0 0 1mm}
.ex.bac .pq{margin:1.8mm 0 0}
.ex.bac .pq-h .cp{margin-left:auto}
.ex .two{gap:4mm}
.wfig .chart{max-width:100%}
.two .wfig{margin:0}
.cellans{display:block;min-height:5mm;position:relative}
.prof .cellans[data-a]::after{left:0;top:.2mm;right:0;white-space:normal;font-size:9pt;line-height:1.1;text-align:center}
.prof table.dt .cellans[data-a]::after,.prof table.tk-t .cellans[data-a]::after{text-align:right}
.prof .lines i[data-a]::after{font-size:9.6pt}
/* ---------- pages fixes : mode d’emploi, sommaire ---------- */
.guide-g{display:grid;grid-template-columns:1fr 1fr;gap:2.4mm}
.gd{display:grid;grid-template-columns:10mm 1fr;gap:2mm;align-items:start;background:#F3F6FE;border-radius:3.4mm;padding:2mm 3mm}
.gd .gi{font-size:16pt;line-height:1}.gd b{display:block;font:800 11pt 'Inter';color:#2B2D7C}.gd span{font-size:10pt;line-height:1.28}
.compet{display:grid;grid-template-columns:auto 1fr;gap:1.4mm 3mm;align-items:center;font-size:10.2pt}
.palx{display:grid;grid-template-columns:auto 1fr;gap:1.6mm 3mm;align-items:center;font-size:10.4pt}
.toc2{display:grid;gap:1.6mm}
.tc2{display:grid;grid-template-columns:11mm 1fr auto;gap:3mm;align-items:center;border-radius:3.4mm;padding:2mm 4mm;background:var(--tt)}
.tc2 .tn2{display:grid;place-items:center;width:9mm;height:9mm;border-radius:50%;background:var(--cc);color:#fff;font:800 12pt 'Inter'}
.tc2 b{font:800 12.5pt 'Inter';color:var(--cc);display:block}.tc2 span{font-size:9.6pt;color:#2d3356}
.tc2 .tp2{font:800 12pt 'Inter';color:var(--cc)}
.tc2.soon{opacity:.55}
.tc2.ann{background:#F3F4F9;--cc:#2B2D7C}
/* corrigé et coups de pouce */
.pc{border-left:3mm solid var(--cc);padding:.6mm 0 .6mm 3.4mm;margin-bottom:2.2mm;font-size:10pt}
.pc b{color:var(--cc)}
/* correctifs de la première épreuve */
.cb3 .cill{display:block;background:#fff;border:1.4px solid color-mix(in srgb,var(--cc) 25%,#fff);border-radius:3mm;padding:1mm}
.cb3 .cill svg{width:100%;height:auto;display:block}
table.fml{border-collapse:collapse;margin:.6mm 0}table.fml td{padding:.5mm 1.4mm .5mm 0;vertical-align:middle;font-size:10.2pt}
/* fiches de vocabulaire : dessin au-dessus du texte, deux fiches par ligne */
.colbox .gcard,.cols2 .gcard{display:block;padding:2mm 3mm 2.2mm;border-left-width:2.6mm}
.colbox .gc-ill,.cols2 .gc-ill{height:27mm;width:100%;background:#fff;border:1.2px solid color-mix(in srgb,var(--cc) 22%,#fff);border-radius:2.6mm;padding:.8mm;margin-bottom:1.6mm}
.colbox .gc-ill svg,.cols2 .gc-ill svg{width:100%;height:100%;display:block}
.colbox .gc-w,.cols2 .gc-w{font-size:13pt}
.gc-h .sym{font:800 9pt 'Inter';color:var(--cc)}
.colbox .gc-def,.cols2 .gc-def{font-size:10.3pt}
.colbox .gc-man,.cols2 .gc-man{font-size:9.6pt;background:#F4F6FC;border-radius:1.6mm;padding:.6mm 2mm;margin:.8mm 0}
.colbox .gcard .note,.cols2 .gcard .note{font-size:9pt;color:#545B7A}
.colbox .gc-ph,.cols2 .gc-ph{font-size:9.6pt;font-style:italic;padding-left:0;color:#2d3356}
table.dt .cellans{display:inline-block;min-width:18mm;border-bottom:1.2px solid #1D2240;min-height:4.6mm}
table.dt.dt-kv td:last-child{white-space:nowrap}
.pr-s{top:auto;bottom:-3mm;right:-3mm}
/* retenir les mots */
.vq{border:2px solid var(--cc);border-radius:4mm;padding:2.2mm 3.2mm;margin-bottom:2.8mm;background:#fff}
.vq-h{font:800 12pt 'Inter';color:var(--cc);margin-bottom:1mm}
.vq .bank{margin:1mm 0 1.6mm;gap:1.4mm;padding:1.4mm}.vq .tag{font-size:9.4pt}
.vq-l{display:flex;gap:1.6mm;align-items:flex-start;margin:1.2mm 0;font-size:10.2pt;line-height:1.45}
.vq-l .jms-n{margin-top:.6mm}
.tbl.vqt{width:100%;font-size:9.8pt;margin:0}.tbl.vqt td{text-align:left;border:1px solid #C9D1EA;padding:1mm 2mm}.tbl.vqt td:last-child{width:34mm}
.paging [data-a]::after,.paging .ok .box::after{content:none!important}
.colbox .gc-ill,.cols2 .gc-ill{height:23mm}
/* ================= Version 2 : leçon, astuces, résolus, mécanique ================= */
mark.hl{background:linear-gradient(transparent 10%,#FFE47A 10%,#FFE47A 90%,transparent 90%);color:inherit;font-weight:700;padding:0 .12em;border-radius:1.5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.fx{display:inline-block;background:var(--tt);border:1.3px solid var(--cc);border-radius:1.8mm;padding:0 1.8mm;font-weight:700;color:#1D2240;white-space:nowrap;line-height:1.5}
/* leçon */
.lc{border:1.8px solid color-mix(in srgb,var(--cc) 35%,#fff);border-left:3.2mm solid var(--cc);border-radius:4mm;background:#fff;padding:2mm 3.4mm 2.4mm;margin-bottom:2.6mm}
.lc-h{display:flex;align-items:center;gap:2.2mm;font:800 12.5pt 'Inter';color:var(--cc);margin-bottom:1.6mm}
.lc-n{display:inline-grid;place-items:center;min-width:6.6mm;height:6.6mm;border-radius:50%;background:var(--cc);color:#fff;font:800 10pt 'Inter'}
.lc-g{display:grid;grid-template-columns:1.25fr 1fr;gap:2.6mm}
.lc-g.withill{grid-template-columns:1.25fr 1fr 34mm}
.lc-r{background:#F4F6FC;border-radius:2.6mm;padding:1.4mm 2.6mm;font-size:10.8pt;line-height:1.35}
.lc-e{background:#FFFBEA;border:1.2px dashed #E3C766;border-radius:2.6mm;padding:1.4mm 2.6mm;font-size:10.6pt;line-height:1.35}
.lc-r p,.lc-e p{margin:.9mm 0}
.lc-t,.lc-t2{display:inline-block;font:800 7.8pt 'Inter';text-transform:uppercase;letter-spacing:.05em;border-radius:99px;padding:.2mm 2.4mm;margin-bottom:.4mm}
.lc-t{background:var(--cc);color:#fff}.lc-t2{background:#FFC233;color:#3F2A00}
.lc-e b{color:var(--cc)}
.lc-i{background:#fff;border:1.2px solid color-mix(in srgb,var(--cc) 22%,#fff);border-radius:2.6mm;padding:.8mm;align-self:center}.lc-i svg{width:100%;height:auto;display:block}
.lc .att{margin-top:1.6mm;font-size:10.2pt;padding:1mm 2.6mm}
.lc .tvat{margin-top:2mm}
.lc .cbig{margin:2mm auto 0;max-width:140mm}
.mk{border:1.8px solid color-mix(in srgb,var(--cc) 35%,#fff);border-left:3.2mm solid var(--cc);border-radius:4mm;padding:2mm 3.4mm;margin-bottom:2.6mm;background:#fff}
.tbl.mkt{width:100%;border:none;margin:0;font-size:10pt}.tbl.mkt td{border:none;border-bottom:1px dotted #C9D1EA;text-align:left;padding:.8mm 1.6mm}
.tbl.mkt td.mk-w{font:800 9.8pt 'Inter';color:var(--cc);width:58mm}
/* astuces */
.ast{border:2px solid #2B2D7C;border-radius:5mm;padding:2.2mm 3.4mm 3mm;margin-bottom:3mm;background:#fff}
.ast-h{font:800 13pt 'Inter';color:#2B2D7C;margin-bottom:2mm}.ast-h span{font:700 9pt 'Inter';color:#545B7A;margin-left:2mm}
.ast-g{display:grid;grid-template-columns:1fr 1fr;gap:2.4mm}
.ast-b{border-radius:3mm;padding:1.6mm 2.8mm;font-size:10.2pt;line-height:1.32}
.ast-b p{margin:.9mm 0;padding-left:3.4mm;position:relative}.ast-b p::before{content:"›";position:absolute;left:0;font-weight:800}
.ast-t{font:800 10.8pt 'Inter';margin-bottom:.6mm}
.ast-vite{background:#E0EBFD}.ast-vite .ast-t{color:#173F86}
.ast-og{background:#FFF1CC}.ast-og .ast-t{color:#6B4600}
.ast-sens{background:#EEE3FB}.ast-sens .ast-t{color:#4F2390}
.ast-verif{background:#DCF4E4}.ast-verif .ast-t{color:#14572F}
/* exercice résolu pas à pas */
.rs{border:2px solid var(--cc);border-radius:5mm;margin-bottom:3.2mm;background:#fff;overflow:hidden}
.rs-h{display:flex;align-items:center;gap:2.4mm;background:var(--tt);padding:1.6mm 3.6mm}
.rs-k{background:var(--cc);color:#fff;font:800 9pt 'Inter';border-radius:99px;padding:.4mm 3mm;white-space:nowrap}
.rs-t{font:800 11.8pt 'Inter';color:var(--cc);flex:1}
.rs-en{margin:2mm 3.6mm 1.6mm;padding:1.4mm 3mm;border-left:2.4mm solid #FFC233;background:#FFFBEA;border-radius:0 2.4mm 2.4mm 0;font-size:11pt}
table.rs-t2{width:calc(100% - 7.2mm);margin:0 3.6mm;border-collapse:collapse}
table.rs-t2 th{font:800 8.2pt 'Inter';text-transform:uppercase;letter-spacing:.05em;color:#545B7A;text-align:left;padding:.6mm 2mm;border-bottom:1.6px solid var(--cc)}
table.rs-t2 td{padding:1.3mm 2mm;border-bottom:1px solid #E1E6F5;vertical-align:middle}
td.rs-w{width:56%;font-size:11pt;background:repeating-linear-gradient(#fff 0 6.4mm,#F2F5FC 6.4mm 6.5mm)}
td.rs-w{display:table-cell}
td.rs-w>span:last-child{display:inline}
.rs-s{display:inline-grid;place-items:center;width:5.4mm;height:5.4mm;border-radius:50%;background:var(--cc);color:#fff;font:800 8.4pt 'Inter';margin-right:2mm;vertical-align:1px}
td.rs-x{font-size:9.8pt;color:#2d3356;border-left:2px solid var(--tt);position:relative;padding-left:4.6mm!important}
td.rs-x::before{content:"";position:absolute;left:1.2mm;top:50%;margin-top:-1.4mm;border:1.4mm solid transparent;border-right:1.8mm solid var(--cc);border-left:0}
b.nw{background:linear-gradient(transparent 12%,#FFE47A 12%,#FFE47A 88%,transparent 88%);padding:0 .15em;border-radius:1.5px}
.rs-rep{margin:1.8mm 3.6mm .6mm;background:#DCF4E4;border-radius:2mm;padding:1.2mm 3mm;font-size:11pt;font-weight:700}
.rs-go{margin:.6mm 3.6mm 2.2mm;font:700 9.4pt 'Inter';color:var(--cc);text-align:right}
/* mécanique : grilles d’items */
.mg{display:grid;gap:2.2mm 5mm;margin:1mm 0 .6mm}

<script>/* Maths et MCV · 2de — générateurs d’exercices (communs à l’appli et au manuel PDF).
   Chaque générateur reçoit un tirage R et renvoie un item :
   { q: énoncé HTML, a: réponse affichée, v: valeur numérique attendue (ou null), tol: tolérance,
     choices: [..] et ok: indice (pour un QCM) }.
   Les réponses sont toujours calculées, jamais écrites à la main. */
(function (root) {
  'use strict';
  /* ---------- nombres à la française ---------- */
  const NB = ' ', NBS = ' ';
  function rnd(x, d = 2) { const s = Math.sign(x) || 1, a = Math.abs(x); return s * Number(Math.round(Number(a.toFixed(10) + 'e' + d)) + 'e-' + d); }
  function fr(x, d = null) {
    let v = d == null ? rnd(x, 6) : rnd(x, d);
    let s = d == null ? String(v) : Math.abs(v).toFixed(d);
    if (d == null && /e/.test(s)) s = v.toFixed(6).replace(/0+$/, '');
    let [i, f] = s.replace('-', '').split('.');
    i = i.replace(/\B(?=(\d{3})+(?!\d))/g, NB);
    return (v < 0 ? '−' : '') + i + (f ? ',' + f : '');
  }
  const eur = (x, d = 2) => fr(x, d) + NBS + '€';
  const pct = (x, d = null) => fr(x, d) + NBS + '%';
  const sg = t => (t > 0 ? '+' + NBS : t < 0 ? '−' + NBS : '') + pct(Math.abs(t));
  const cm = x => fr(rnd(x, 6));
  const frac = (n, d) => `<span class="fr"><span class="fn">${n}</span><span class="fd">${d}</span></span>`;
  const TOL = d => 0.5 * Math.pow(10, -d) + 1e-9;

  /* ---------- tirage reproductible ---------- */
  function rng(seed) {
    let a = seed >>> 0;
    const R = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    R.int = (lo, hi) => lo + Math.floor(R() * (hi - lo + 1));
    R.pick = arr => arr[Math.floor(R() * arr.length)];
    R.shuffle = arr => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
    R.sign = () => (R() < .5 ? -1 : 1);
    return R;
  }
  const qcm = (q, good, bads, R, a) => { const ch = R.shuffle([good, ...bads]); return { q, choices: ch, ok: ch.indexOf(good), a: a || good, v: null }; };
  const num = (q, v, d, a) => ({ q, v, tol: TOL(d), a });

  const G = {};
  /* ======================= Chapitre 1 · Prix, marges et TVA ======================= */
  G.pctOf = R => { const t = R.pick([10, 20, 5, 25, 50, 75, 1, 15, 30, 12.5, 40]); const base = t === 12.5 ? 8 : t === 75 || t === 25 ? 4 : t === 15 || t === 30 ? 20 : t === 5 ? 20 : t === 1 ? 100 : 10; const v = base * R.int(2, 40); const r = rnd(v * t / 100); return num(`${fr(t)} % de ${fr(v)}`, r, 2, fr(r)); };
  G.prop = R => { const p = R.pick([5, 10, 15, 20, 25, 30, 40, 60, 75, 12.5, 2.5]); const tot = R.pick([40, 80, 120, 160, 200, 400]); const part = rnd(tot * p / 100); return num(`${fr(part)} sur ${fr(tot)}`, p, 1, pct(p)); };
  G.ecrit = R => { const t = R.pick([35, 8, 20, 125, 5.5, 2.1, 75, 60, 4, 150]); return R() < .5 ? num(`${fr(t / 100)} = …… %`, t, 2, pct(t)) : num(`${pct(t)} = …… (décimal)`, t / 100, 4, fr(t / 100)); };
  G.cmOf = R => { const t = R.sign() * R.pick([5, 8, 12, 15, 20, 25, 30, 40, 60, 2.5, 12.5, 2.1, 5.5]); const k = rnd(1 + t / 100, 4); return num(`${sg(t)} → CM =`, k, 4, cm(k)); };
  G.evolOf = R => { const t = R.sign() * R.pick([5, 10, 15, 20, 25, 30, 40, 50, 1, 0.5]); const k = rnd(1 + t / 100, 4); return num(`× ${cm(k)} → évolution (%)`, t, 2, sg(t)); };
  G.apply = R => { const t = R.sign() * R.pick([5, 10, 15, 20, 25, 30, 8, 12.5, 2.5]); const v = R.pick([R.int(4, 30) * 4, R.int(10, 90) + .9, R.int(2, 40) * 10]); const r = rnd(v * (1 + t / 100)); return num(`${fr(v)} ${sg(t)} =`, r, 2, fr(r)); };
  G.taux = R => { const t = R.sign() * R.pick([5, 10, 15, 20, 25, 30, 40, 2.5, 12]); const v0 = R.pick([20, 40, 50, 80, 120, 200, 250]); const v1 = rnd(v0 * (1 + t / 100)); return num(`de ${fr(v0)} à ${fr(v1)} : taux (%)`, t, 1, sg(t)); };
  G.succ = R => { const a = R.sign() * R.pick([10, 20, 5, 25, 30]), b = R.sign() * R.pick([10, 20, 5, 25, 50]); const k = rnd((1 + a / 100) * (1 + b / 100), 4), t = rnd((k - 1) * 100, 2); return num(`${sg(a)} puis ${sg(b)} : taux global (%)`, t, 2, t === 0 ? '0 %' : sg(t)); };
  G.depart = R => { const t = R.sign() * R.pick([10, 20, 25, 40, 5, 50]); const v0 = R.pick([40, 60, 80, 120, 200, 250, 30]); const v1 = rnd(v0 * (1 + t / 100)); return num(`après ${sg(t)} : ${fr(v1)} ; départ =`, v0, 2, fr(v0)); };
  G.ht2ttc = R => { const t = R.pick([20, 20, 10, 5.5]); const h = R.pick([R.int(2, 60) * 5, R.int(4, 40) * 2.5, R.int(10, 99)]); const r = rnd(h * (1 + t / 100)); return num(`${eur(h)} HT, TVA ${fr(t)} % → TTC`, r, 2, eur(r)); };
  G.ttc2ht = R => { const t = R.pick([20, 20, 10, 5.5]); const h = R.pick([R.int(2, 60) * 5, R.int(10, 99)]); const c = rnd(h * (1 + t / 100)); return num(`${eur(c)} TTC, TVA ${fr(t)} % → HT`, h, 2, eur(h)); };
  G.tva6 = R => { const c = 6 * R.int(2, 60); return num(`${eur(c, 0)} TTC (TVA 20 %) → TVA`, c / 6, 2, eur(c / 6, 0)); };
  G.marge = R => { const c = R.pick([10, 12, 16, 20, 25, 30, 40, 45, 50, 60]), m = R.pick([.25, .5, .75, 1, 1.5, .2]) * c, v = c + m; return R() < .5 ? num(`coût ${eur(c, 0)} HT, vente ${eur(v)} HT → taux de marge (%)`, rnd(m / c * 100, 1), 1, pct(rnd(m / c * 100, 1))) : num(`coût ${eur(c, 0)} HT, vente ${eur(v)} HT → taux de marque (%)`, rnd(m / v * 100, 1), 1, pct(rnd(m / v * 100, 1))); };
  G.og1 = R => { const v = R.pick([19.9, 29.9, 49.99, 99.9, 9.95, 199]); const t = R.pick([20, 30, 50]); const e = v * (1 - t / 100); const g = Math.round(e / (e < 20 ? 1 : 5)) * (e < 20 ? 1 : 5); const bads = [g * 10, Math.max(1, Math.round(g / 10))].map(x => eur(x, 0)); return qcm(`${eur(v)} − ${t} % ≈`, eur(g, 0), bads, R, `${eur(g, 0)} (exact : ${eur(e)})`); };

  /* ======================= Chapitre 2 · Statistique ======================= */
  const serie = (R, n, lo, hi) => Array.from({ length: n }, () => R.int(lo, hi));
  const sorted = a => a.slice().sort((x, y) => x - y);
  const med = a => { const s = sorted(a), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
  const quart = (a, k) => sorted(a)[Math.ceil(k * a.length / 4) - 1];
  const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
  const sd = a => { const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) * (x - m), 0) / a.length); };
  const liste = a => a.map(x => fr(x)).join(' ; ');
  G.moy = R => { const a = serie(R, R.int(5, 7), 8, 30); const m = rnd(mean(a), 1); return num(`Moyenne de : ${liste(a)}`, m, 1, fr(m)); };
  G.moyP = R => { const xs = R.shuffle([5, 10, 15, 20, 25, 30]).slice(0, 3).sort((x, y) => x - y), ns = xs.map(() => R.int(2, 12)); const m = rnd(xs.reduce((s, x, i) => s + x * ns[i], 0) / ns.reduce((s, x) => s + x, 0), 1); return num(`Moyenne pondérée : valeurs ${xs.join(' ; ')} avec les effectifs ${ns.join(' ; ')}`, m, 1, fr(m)); };
  G.med = R => { const a = serie(R, R.int(5, 8), 2, 40); const m = med(a); return num(`Médiane de : ${liste(a)}`, m, 1, fr(m)); };
  G.etendue = R => { const a = serie(R, 6, 5, 60); return num(`Étendue de : ${liste(a)}`, Math.max(...a) - Math.min(...a), 0, fr(Math.max(...a) - Math.min(...a))); };
  G.q1 = R => { const a = serie(R, R.int(7, 12), 1, 30); const q = quart(a, 1); return num(`Premier quartile Q<sub>1</sub> de : ${liste(a)}`, q, 0, fr(q)); };
  G.q3 = R => { const a = serie(R, R.int(7, 12), 1, 30); const q = quart(a, 3); return num(`Troisième quartile Q<sub>3</sub> de : ${liste(a)}`, q, 0, fr(q)); };
  G.eiq = R => { const a = serie(R, 8, 1, 30); const e = quart(a, 3) - quart(a, 1); return num(`Écart interquartile de : ${liste(a)}`, e, 0, fr(e)); };
  G.freq = R => { const n = R.pick([20, 25, 40, 50, 80, 200]), k = R.int(1, n - 1); const f = rnd(k / n * 100, 1); return num(`${k} clients sur ${n} : fréquence (%)`, f, 1, pct(f)); };
  G.angle = R => { const f = R.pick([10, 15, 20, 25, 30, 40, 45, 50, 5]); return num(`Fréquence ${pct(f)} → angle du secteur (°)`, f * 3.6, 0, fr(f * 3.6) + '°'); };
  G.sigma = R => { const a = serie(R, 5, 4, 20); const s = rnd(sd(a), 1); return num(`Écart type (calculatrice) de : ${liste(a)}`, s, 1, fr(s)); };
  G.mode = R => { const m = R.int(1, 9), others = R.shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9].filter(x => x !== m)).slice(0, 4); const a = R.shuffle([m, m, m, ...others, others[0]]); return num(`Mode de : ${liste(a)}`, m, 0, fr(m)); };

  /* ======================= Chapitre 3 · Premier degré ======================= */
  const xs = R => R.pick([R.int(-9, 12), R.int(1, 20) / 2]);
  G.eq1 = R => { const a = R.pick([2, 3, 4, 5, 6, 8, 0.5, 1.5, 2.5]), x = R.int(1, 20); const b = rnd(a * x); return num(`${fr(a)}x = ${fr(b)} ; x =`, x, 2, fr(x)); };
  G.eq2 = R => { const a = R.pick([2, 3, 4, 5, -2, -3]), x = xs(R), b = R.int(-15, 15); const c = rnd(a * x + b); return num(`${fr(a)}x ${b < 0 ? '−' : '+'} ${fr(Math.abs(b))} = ${fr(c)} ; x =`, x, 2, fr(x)); };
  G.eq3 = R => { let a = R.int(2, 9), c = R.int(1, 8); if (a === c) a++; const x = R.int(-6, 10), b = R.int(-12, 12); const d = (a - c) * x + b; return num(`${a}x ${b < 0 ? '−' : '+'} ${Math.abs(b)} = ${c}x ${d < 0 ? '−' : '+'} ${Math.abs(d)} ; x =`, x, 2, fr(x)); };
  G.ineq = R => { const a = R.pick([2, 3, 4, 5]), x0 = R.int(-5, 9), b = R.int(-10, 10), c = a * x0 + b, sgn = R.pick(['<', '≤', '>', '≥']); const ivl = { '<': `]−∞ ; ${fr(x0)}[`, '≤': `]−∞ ; ${fr(x0)}]`, '>': `]${fr(x0)} ; +∞[`, '≥': `[${fr(x0)} ; +∞[` }; const opp = { '<': '≥', '≤': '>', '>': '≤', '≥': '<' }; return qcm(`${a}x ${b < 0 ? '−' : '+'} ${Math.abs(b)} ${sgn} ${c}`, ivl[sgn], [ivl[opp[sgn]], sgn === '<' || sgn === '>' ? ivl[sgn === '<' ? '≤' : '≥'] : ivl[sgn === '≤' ? '<' : '>']], R); };
  G.trad = R => { const p = R.int(3, 15), r = R.int(20, 60); return qcm(`Un article coûte x €. Avec ${p} € de livraison, je paie ${r} €.`, `x + ${p} = ${r}`, [`${p}x = ${r}`, `x − ${p} = ${r}`], R); };
  G.estSol = R => { const a = R.int(2, 6), x = R.int(1, 9), b = R.int(1, 12), c = a * x + b, t = R() < .5 ? x : x + R.pick([1, -1, 2]); return qcm(`${t} est-il solution de ${a}x + ${b} = ${c} ?`, t === x ? 'oui' : 'non', [t === x ? 'non' : 'oui'], R, t === x ? `oui : ${a} × ${t} + ${b} = ${c}` : `non : ${a} × ${t} + ${b} = ${a * t + b}`); };
  G.ivl = R => { const a = R.int(-5, 3), b = a + R.int(2, 9), k = R.int(0, 3); const forms = [[`${a} ≤ x ≤ ${b}`, `[${a} ; ${b}]`], [`${a} < x < ${b}`, `]${a} ; ${b}[`], [`${a} ≤ x < ${b}`, `[${a} ; ${b}[`], [`${a} < x ≤ ${b}`, `]${a} ; ${b}]`]]; const [txt, good] = forms[k]; return qcm(txt, good, forms.filter((_, i) => i !== k).slice(0, 2).map(f => f[1]), R); };

  /* ======================= Chapitre 4 · Factures, réductions, intérêts ======================= */
  G.remise = R => { const m = R.int(4, 80) * 10, t = R.pick([2, 3, 5, 8, 10, 15]); const r = rnd(m * (1 - t / 100)); return num(`${eur(m, 0)} avec une remise de ${t} % → net`, r, 2, eur(r)); };
  G.remises2 = R => { const m = R.int(5, 60) * 20, a = R.pick([5, 10, 15]), b = R.pick([2, 3, 5]); const r = rnd(rnd(m * (1 - a / 100)) * (1 - b / 100)); return num(`${eur(m, 0)}, remise ${a} % puis remise ${b} % → net commercial`, r, 2, eur(r)); };
  G.factTTC = R => { const q = R.int(2, 12), pu = R.pick([4.5, 12, 18.6, 25, 7.2, 35]); const ht = rnd(q * pu), ttc = rnd(ht * 1.2); return num(`${q} articles à ${eur(pu)} HT, TVA 20 % → total TTC`, ttc, 2, eur(ttc)); };
  G.intA = R => { const C = R.int(2, 40) * 500, t = R.pick([1, 1.5, 2, 2.5, 3, 4]), n = R.int(1, 5); const I = rnd(C * t / 100 * n); return num(`Capital ${eur(C, 0)}, taux ${pct(t)} par an, ${n} an${n > 1 ? 's' : ''} → intérêts`, I, 2, eur(I)); };
  G.intM = R => { const C = R.int(2, 30) * 600, t = R.pick([1.5, 2, 3, 4]), m = R.pick([3, 6, 9, 4, 8]); const I = rnd(C * t / 100 * m / 12); return num(`${eur(C, 0)} à ${pct(t)} par an pendant ${m} mois → intérêts`, I, 2, eur(I)); };
  G.intJ = R => { const C = R.int(4, 40) * 900, t = R.pick([2, 3, 4]), j = R.pick([30, 60, 90, 45, 120, 180]); const I = rnd(C * t / 100 * j / 360); return num(`${eur(C, 0)} à ${pct(t)} par an pendant ${j} jours → intérêts`, I, 2, eur(I)); };
  G.valAc = R => { const C = R.int(2, 40) * 500, t = R.pick([1, 2, 2.5, 3]), n = R.int(1, 4); const A = rnd(C * (1 + t / 100 * n)); return num(`${eur(C, 0)} à ${pct(t)} par an pendant ${n} an${n > 1 ? 's' : ''} → valeur acquise`, A, 2, eur(A)); };
  G.tauxI = R => { const C = R.int(2, 40) * 500, t = R.pick([1, 1.5, 2, 2.5, 3, 4]), n = R.int(1, 4); const I = rnd(C * t / 100 * n); return num(`${eur(C, 0)} placés ${n} an${n > 1 ? 's' : ''} rapportent ${eur(I)} → taux annuel (%)`, t, 2, pct(t)); };
  G.dureeI = R => { const C = R.int(2, 40) * 600, t = R.pick([2, 3, 4]), m = R.pick([3, 6, 8, 9, 12, 18]); const I = rnd(C * t / 100 * m / 12); return num(`${eur(C, 0)} à ${pct(t)} par an rapportent ${eur(I)} → durée (mois)`, m, 0, m + ' mois'); };

  /* ======================= Chapitre 5 · Fonctions ======================= */
  const aff = (a, b) => `${a === 1 ? '' : a === -1 ? '−' : fr(a)}x ${b < 0 ? '−' : '+'} ${fr(Math.abs(b))}`;
  G.imAff = R => { const a = R.pick([2, 3, -2, 0.5, 1.5, -4, 5]), b = R.int(-10, 10), x = R.int(-5, 8); const y = rnd(a * x + b); return num(`f(x) = ${aff(a, b)} ; f(${fr(x)}) =`, y, 2, fr(y)); };
  G.imCar = R => { const k = R.pick([1, 2, 3, 0.5, -1, -2]), x = R.int(-6, 6); const y = rnd(k * x * x); return num(`g(x) = ${k === 1 ? '' : k === -1 ? '−' : fr(k)}x² ; g(${fr(x)}) =`, y, 2, fr(y)); };
  G.antAff = R => { const a = R.pick([2, 3, 4, -2, 5]), b = R.int(-10, 10), x = R.int(-6, 9); const c = a * x + b; return num(`f(x) = ${aff(a, b)} ; antécédent de ${fr(c)} :`, x, 2, fr(x)); };
  G.coefDir = R => { const a = R.pick([2, 3, -1, -2, 0.5, 4, -3]), b = R.int(-6, 6), x1 = R.int(-3, 2), x2 = x1 + R.int(1, 5); const y1 = a * x1 + b, y2 = a * x2 + b; return num(`Droite passant par A(${fr(x1)} ; ${fr(y1)}) et B(${fr(x2)} ; ${fr(y2)}) : coefficient directeur`, a, 2, fr(a)); };
  G.ordOr = R => { const a = R.pick([2, 3, -1, -2, 4]), b = R.int(-8, 8), x1 = R.int(1, 4); const y1 = a * x1 + b; return num(`Droite de coefficient directeur ${fr(a)} passant par (${x1} ; ${fr(y1)}) : ordonnée à l’origine`, b, 2, fr(b)); };
  G.lin = R => { const k = R.pick([1.5, 2, 2.5, 3, 4, 0.8, 1.2]), x = R.int(2, 12); return num(`Proportionnalité : ${fr(x)} kg coûtent ${eur(rnd(k * x))}. Prix d’un kilo :`, k, 2, eur(k)); };
  G.sens = R => { const a = R.pick([2, 3, -1, -2, 0.5, -0.5, 4]), b = R.int(-9, 9); return qcm(`f(x) = ${aff(a, b)} : f est…`, a > 0 ? 'croissante' : 'décroissante', [a > 0 ? 'décroissante' : 'croissante', 'constante'], R, a > 0 ? `croissante (a = ${fr(a)} > 0)` : `décroissante (a = ${fr(a)} < 0)`); };
  G.appart = R => { const a = R.int(2, 5), b = R.int(-5, 5), x = R.int(-3, 6), ok = R() < .5, y = ok ? a * x + b : a * x + b + R.pick([1, -1, 2]); return qcm(`Le point (${x} ; ${y}) est-il sur la droite y = ${aff(a, b)} ?`, ok ? 'oui' : 'non', [ok ? 'non' : 'oui'], R, `${ok ? 'oui' : 'non'} : ${a} × ${x} ${b < 0 ? '−' : '+'} ${Math.abs(b)} = ${a * x + b}`); };

  /* ======================= Chapitre 6 · Probabilités ======================= */
  const simp = (a, b) => { const g = (x, y) => y ? g(y, x % y) : x; const k = g(a, b); return [a / k, b / k]; };
  G.proba = R => { const n = R.pick([10, 20, 25, 40, 50, 100]), k = R.int(1, n - 1); const p = k / n; return num(`${k} tickets gagnants sur ${n} : probabilité de gagner (décimal)`, rnd(p, 4), 4, fr(rnd(p, 4))); };
  G.probaFr = R => { const n = R.pick([6, 8, 10, 12, 20]), k = R.int(1, n - 1); const [a, b] = simp(k, n); const it = num(`${n} enveloppes, dont ${k} contiennent un bon de réduction. P(bon), en % au dixième :`, rnd(k / n * 100, 1), 1, `${pct(rnd(k / n * 100, 1))} (${a}/${b})`); it.inp = fr(rnd(k / n * 100, 1)); return it; };
  G.contraire = R => { const p = R.pick([0.1, 0.15, 0.2, 0.25, 0.35, 0.4, 0.05, 0.12]); return num(`P(A) = ${fr(p)} ; P(non A) =`, rnd(1 - p, 4), 4, fr(rnd(1 - p, 4))); };
  G.freqObs = R => { const n = R.pick([50, 100, 200, 500, 1000]), k = R.int(Math.round(n * .05), Math.round(n * .6)); return num(`${k} succès sur ${n} essais : fréquence observée (décimal, au centième)`, rnd(k / n, 2), 2, fr(rnd(k / n, 2))); };
  G.denomb = R => { const a = R.int(2, 5), b = R.int(2, 5), c = R() < .5 ? 1 : R.int(2, 3); return num(`Menu : ${a} plats, ${b} desserts${c > 1 ? `, ${c} boissons` : ''}. Nombre de menus différents :`, a * b * c, 0, fr(a * b * c)); };
  G.de2 = R => { const s = R.int(2, 12); const k = 6 - Math.abs(7 - s); return num(`Deux dés : nombre d’issues donnant une somme de ${s} (sur 36)`, k, 0, fr(k)); };

  /* ======================= Chapitre 7 · Géométrie ======================= */
  const TRIP = [[3, 4, 5], [6, 8, 10], [5, 12, 13], [9, 12, 15], [8, 15, 17], [12, 16, 20], [7, 24, 25], [20, 21, 29]];
  G.pytH = R => { const t = R.pick(TRIP), k = R.pick([1, 1, 2, 10]); return num(`Triangle rectangle, côtés de l’angle droit ${t[0] * k} cm et ${t[1] * k} cm : hypoténuse (cm)`, t[2] * k, 1, fr(t[2] * k) + ' cm'); };
  G.pytC = R => { const t = R.pick(TRIP); return num(`Triangle rectangle d’hypoténuse ${t[2]} cm, un côté ${t[0]} cm : autre côté (cm)`, t[1], 1, fr(t[1]) + ' cm'); };
  G.pytD = R => { const a = R.int(2, 9), b = R.int(2, 9); const h = rnd(Math.sqrt(a * a + b * b), 1); return num(`Côtés de l’angle droit ${a} m et ${b} m : hypoténuse (m, au dixième)`, h, 1, fr(h) + ' m'); };
  G.recip = R => { const t = R.pick(TRIP), ok = R() < .5, c = ok ? t[2] : t[2] + 1; return qcm(`Un triangle a pour côtés ${t[0]} ; ${t[1]} ; ${c}. Est-il rectangle ?`, ok ? 'oui' : 'non', [ok ? 'non' : 'oui'], R, `${ok ? 'oui' : 'non'} : ${t[0]}² + ${t[1]}² = ${t[0] * t[0] + t[1] * t[1]} et ${c}² = ${c * c}`); };
  G.thales = R => { const k = R.pick([2, 3, 4, 1.5, 2.5]), a = R.int(2, 8), b = R.int(2, 9); return num(`ABC triangle, M sur [AB], N sur [AC], (MN) parallèle à (BC). AM = ${fr(a)} cm, AB = ${fr(rnd(a * k))} cm, MN = ${fr(b)} cm. BC =`, rnd(b * k), 2, fr(rnd(b * k)) + ' cm'); };
  G.aireR = R => { const L = R.int(2, 15), l = R.pick([1.5, 2, 2.5, 3, 4, 0.8]); return num(`Rectangle ${fr(L)} m × ${fr(l)} m : aire (m²)`, rnd(L * l), 2, fr(rnd(L * l)) + ' m²'); };

\/span><\/p><p><span class=\"fx\">écart interquartile = Q<sub>3<\/sub> − Q<sub>1<\/sub><\/span> : la moitié centrale des valeurs.<\/p><p><span class=\"fx\">écart type σ<\/span> : calculé avec la calculatrice (σx) ou le tableur. Plus il est grand, plus les valeurs sont éloignées de la moyenne.<\/p>","ex":"<p>min 5, max 12 : étendue = <b>7<\/b><\/p><p>Q<sub>3<\/sub> − Q<sub>1<\/sub> = 9 − 6 = <b>3<\/b><\/p>","ill":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" class=\"pic\"><line x1=\"14\" x2=\"146\" y1=\"44\" y2=\"44\" class=\"ks\" stroke-width=\"2\"/><circle cx=\"24\" cy=\"44\" r=\"6\" class=\"k\"/><circle cx=\"136\" cy=\"44\" r=\"6\" class=\"k\"/><path d=\"M24 35V30H136V35\" fill=\"none\" class=\"ks\" stroke-width=\"1.6\"/><text x=\"80\" y=\"26\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">max − min<\/text><text x=\"24\" y=\"66\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">min<\/text><text x=\"136\" y=\"66\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">max<\/text><\/svg>"},{"titre":"Boîte à moustaches, comparer deux séries","rule":"<p>La boîte va de Q<sub>1<\/sub> à Q<sub>3<\/sub> ; le trait intérieur est la médiane ; les moustaches vont du minimum au maximum.<\/p><p>Pour comparer : on compare les <span class=\"fx\">médianes<\/span> (le niveau) et les <span class=\"fx\">écarts interquartiles<\/span> (la régularité).<\/p>","ex":"<p>Magasin A : Me = 31 €, Q<sub>3<\/sub> − Q<sub>1<\/sub> = 18 €.<\/p><p>Magasin B : Me = 33 €, Q<sub>3<\/sub> − Q<sub>1<\/sub> = 10 € : B est <b>plus régulier<\/b>.<\/p>","ill":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" class=\"pic\"><line x1=\"14\" x2=\"146\" y1=\"44\" y2=\"44\" class=\"ks\" stroke-width=\"2\"/><rect x=\"44\" y=\"30\" width=\"62\" height=\"28\" class=\"k2 ks\" stroke-width=\"2\"/><line x1=\"70\" x2=\"70\" y1=\"30\" y2=\"58\" class=\"ks\" stroke-width=\"3\"/><line x1=\"14\" x2=\"14\" y1=\"36\" y2=\"52\" class=\"ks\" stroke-width=\"2\"/><line x1=\"146\" x2=\"146\" y1=\"36\" y2=\"52\" class=\"ks\" stroke-width=\"2\"/><text x=\"14\" y=\"76\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">min<\/text><text x=\"44\" y=\"76\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">Q₁<\/text><text x=\"70\" y=\"76\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">Me<\/text><text x=\"106\" y=\"76\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">Q₃<\/text><text x=\"146\" y=\"76\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">max<\/text><\/svg>"}],"mots":[["effectif, fréquence","nombre de valeurs ; effectif ÷ effectif total"],["moyenne","somme des valeurs ÷ effectif total"],["médiane","valeur du milieu de la série rangée"],["quartiles Q₁, Q₃","au moins 25 % (ou 75 %) des valeurs sont inférieures ou égales"],["étendue, écart interquartile","max − min ; Q₃ − Q₁"],["écart type","mesure de la dispersion autour de la moyenne"]],"astuces":[{"k":"vite","ic":"⚡","t":"Calculer vite","items":["Je range d’abord la série : tout devient plus simple.","Calculatrice : menu STAT, je saisis valeurs et effectifs, je lis x̄, Med, Q1, Q3, σx."]},{"k":"og","ic":"🎯","t":"Estimer","items":["La moyenne est toujours entre le minimum et le maximum.","Une valeur très grande tire la moyenne vers le haut, pas la médiane."]},{"k":"sens","ic":"💡","t":"Donner du sens","items":["Médiane 25 € : la moitié des paniers vaut 25 € ou moins.","Q<sub>3<\/sub> = 40 € : 75 % des paniers valent 40 € ou moins."]},{"k":"verif","ic":"✅","t":"Vérifier","items":["La somme des effectifs = l’effectif total ; la somme des fréquences = 100 %.","On doit avoir min ≤ Q<sub>1<\/sub> ≤ Me ≤ Q<sub>3<\/sub> ≤ max."]}],"resolus":[{"titre":"Moyenne, médiane, quartiles d’une liste","outil":"🧮 calculatrice","enonce":"Montants de <mark class=\"hl\">11 tickets<\/mark> (en €) : <mark class=\"hl\">25 ; 18 ; 41 ;  class=\"tx\">5<\/text><text x=\"80\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\" class=\"kt\">[2 ; 5[<\/text><\/svg>","def":"Ensemble des nombres compris entre deux bornes.","formule":"[2 ; 5[ : 2 ≤ x < 5","phrase":"Les solutions forment l’intervalle [17 500 ; +∞[."},{"id":"inequation","mot":"l’inéquation","pic":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" class=\"pic\"><line x1=\"10\" x2=\"150\" y1=\"46\" y2=\"46\" class=\"ks\" stroke-width=\"2\"/><path d=\"M52 34L46 34L46 58L52 58\" class=\"ks\" stroke-width=\"2.6\" fill=\"none\"/><path d=\"M108 34L114 34L114 58L108 58\" class=\"ks\" stroke-width=\"2.6\" fill=\"none\"/><line x1=\"46\" x2=\"114\" y1=\"46\" y2=\"46\" class=\"ks\" stroke-width=\"5\"/><text x=\"46\" y=\"76\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">2<\/text><text x=\"114\" y=\"76\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">5<\/text><text x=\"80\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\" class=\"kt\">[2 ; 5[<\/text><\/svg>","def":"Inégalité qui contient une inconnue.","formule":"2x + 3 < 11","phrase":"Je résous une inéquation pour trouver un seuil."}]},{"id":"c4","n":4,"col":"verbe","icone":"🧾","dom":"Calculs commerciaux","titre":"Factures, réductions et intérêts","intro":"Établir un devis, compléter une facture, accorder une remise, placer de l’argent : des calculs de tous les jours en entreprise.","obj":["Distinguer remise, rabais et ristourne.","Enchaîner des réductions et compléter une facture.","Calculer un intérêt simple et une valeur acquise.","Retrouver un taux ou une durée de placement."],"auto":["remise","pctOf","cmOf","ht2ttc","intA","apply"],"lecons":[{"titre":"Les réductions commerciales","rule":"<p><span class=\"fx\">remise<\/span> : pour une grosse quantité ou un client fidèle.<\/p><p><span class=\"fx\">rabais<\/span> : pour un défaut ou un retard de livraison.<\/p><p><span class=\"fx\">ristourne<\/span> : en fin de période, sur le chiffre d’affaires réalisé.<\/p><p>Réductions successives : chacune s’applique au <span class=\"fx\">net précédent<\/span>.<\/p>","ex":"<p>500 € avec 10 % puis 5 % :<\/p><p>500 × 0,9 = 450 ; 450 × 0,95 = <b>427,50 €<\/b><\/p>","att":"10 % puis 5 % ne fait pas 15 % : 500 × 0,85 = 425 €.","ill":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" class=\"pic\"><rect x=\"6\" y=\"30\" width=\"46\" height=\"28\" rx=\"5\" class=\"k2 ks\" stroke-width=\"1.6\"/><text x=\"29\" y=\"47.96\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">100 €<\/text><path d=\"M56 44H99\" class=\"ks\" stroke-width=\"2.2\" fill=\"none\"/><path d=\"M97 39L104 44L97 49Z\" class=\"k\"/><text x=\"80\" y=\"37\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"700\" class=\"kt\">− 10 %<\/text><rect x=\"108\" y=\"30\" width=\"46\" height=\"28\" rx=\"5\" class=\"k ks\" stroke-width=\"1.6\"/><text x=\"131\" y=\"47.96\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"700\" class=\"tw\">90 €<\/text><text x=\"80\" y=\"80\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">remise sur le prix<\/text><\/svg>"},{"titre":"Devis et facture","rule":"<p><span class=\"fx\">montant brut = quantité × prix unitaire HT<\/span><\/p><p>− réductions = <span class=\"fx\">net commercial HT<\/span><\/p><p>+ frais de port = total HT ; + TVA = <span class=\"fx\">net à payer TTC<\/span><\/p><p>Un devis se calcule de la même façon, avant la vente.<\/p>","ex":"<p>20 × 18,50 = 370 € ; − 10 % → 333 €<\/p><p>+ 12 € de port → 345 € HT ; TTC = <b>414 €<\/b><\/p>","ill":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" class=\"pic\"><rect x=\"44\" y=\"8\" width=\"72\" height=\"76\" rx=\"4\" class=\"k2 ks\" stroke-width=\"1.6\"/><line x1=\"54\" x2=\"106\" y1=\"22\" y2=\"22\" class=\"ks\" stroke-width=\"2\"/><line x1=\"54\" x2=\"106\" y1=\"32\" y2=\"32\" class=\"ks\" stroke-width=\"2\"/><line x1=\"54\" x2=\"106\" y1=\"42\" y2=\"42\" class=\"ks\" stroke-width=\"2\"/><rect x=\"54\" y=\"56\" width=\"52\" height=\"18\" rx=\"3\" class=\"k\"/><text x=\"80\" y=\"69\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\" class=\"tw\">NET<\/text><\/svg>"},{"titre":"L’intérêt simple","rule":"<p>Capital C placé au taux annuel t pendant n années : <span class=\"fx\">I = C × t × n<\/span><\/p><p>En mois : n = mois ÷ 12. En jours : n = jours ÷ 360.<\/p><p><span class=\"fx\">valeur acquise A = C + I<\/span><\/p>","ex":"<p>3 600 € à 2,5 % pendant 8 mois :<\/p><p>I = 3 600 × 0,025 × 8 ÷ 12 = <b>60 €<\/b> ; A = <b>3 660 €<\/b><\/p>","ill":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" class=\"pic\"><rect x=\"22\" y=\"42\" width=\"22\" height=\"30\" class=\"k2 ks\" stroke-width=\"1.2\"/><text x=\"33\" y=\"84\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">an 0<\/text><rect x=\"54\" y=\"34\" width=\"22\" height=\"38\" class=\"k\" stroke-width=\"1.2\"/><text x=\"65\" y=\"84\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">an 1<\/text><rect x=\"86\" y=\"26\" width=\"22\" height=\"46\" class=\"k\" stroke-width=\"1.2\"/><text x=\"97\" y=\"84\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">an 2<\/text><rect x=\"118\" y=\"18\" width=\"22\" height=\"54\" class=\"k\" stroke-width=\"1.2\"/><text x=\"129\" y=\"84\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">an 3<\/text><text x=\"80\" y=\"18\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\" class=\"kt\">chaque année : + C × t<\/text><\/svg>"},{"titre":"Retrouver un taux ou une durée","rule":"<p><span class=\"fx\">t = I ÷ (C × n)<\/span><\/p><p><span class=\"fx\">n = I ÷ (C × t)<\/span><\/p><p>Les intérêts sont proportionnels à la durée : leur graphique est une droite qui passe par l’origine.<\/p>","ex":"<p>5 000 € rapportent 400 € en 4 ans :<\/p><p>t = 400 ÷ (5 000 × 4) = 0,02 = <b>2 %<\/b><\/p>"}],"mots":[["remise, rabais, ristourne","réductions : quantité ou fidélité ; défaut ; fin de période"],["net commercial","montant après réductions, avant TVA"],["devis, facture","proposition de prix ; document de vente"],["capital, taux, intérêt","somme placée ; pourcentage annuel ; somme gagnée"],["valeur acquise","capital + intérêts"]],"astuces":[{"k":"vite","ic":"⚡","t":"Calculer vite","items":["Remise de 10 % : je garde 90 %, × 0,9.","6 mois = la moitié d’une année : intérêts annuels ÷ 2."]},{"k":"og","ic":"🎯","t":"Estimer","items":["1 000 € à 2 % par an : environ 20 € par an.","Deux remises de 10 % et 5 % : un peu moins de 15 %."]},{"k":"sens","ic":"💡","t":"Donner du sens","items":["La TVA se calcule après les réductions et les frais de port.","Taux annuel : la durée doit être en années (mois ÷ 12, jours ÷ 360)."]},{"k":"verif","ic":"✅","t":"Vérifier","items":["Net à payer = total HT + TVA.","Valeur acquise = capital + intérêts, donc plus grande que le capital."]}],"resolus":[{"titre":"Calculer le net à payer d’une facture","outil":"🧮 calculatrice","enonce":"<mark class=\"hl\">20 sacs<\/mark> à <mark class=\"hl\">18,50 € HT<\/mark> ; remise de <mark class=\"hl\">10 %<\/mark> puis remise fidélité de <mark class=\"hl\">2 %<\/mark> ; frais de port <mark class=\"hl\">12 € HT<\/mark> ; TVA <mark class=\"hl\">20 %<\/mark>.","rows":[["Brut = 20 × 18,50 = <b class=\"nw\">370 €<\/b>","Quantité × prix unitaire HT."],["370 × 0,9 = 333 € ; 333 × 0,98 = <b class=\"nw\">326,34 €<\/b>","Chaque remise s’applique au net précédent."],["Total HT = 326,34 + 12 = <b class=\"nw\">338,34 €<\/b>","J’ajoute les frais de port."],["TVA = 338,34 × 0,2 ≈ <b class=\"nw\">67,67 €<\/b>","La TVA porte sur le total HT."],["Net à payer = 338,34 + 67,67 = <b class=\"nw\">406,01 €<\/b>","Total HT + TVA."]],"rep":"Le client paie 406,01 €.","go":["m2","c1"]},{"titre":"Calculer un intérêt simple","outil":"🧮 calculatrice","enonce":"<mark class=\"hl\">3 600 €<\/mark> sont placés à <mark class=\"hl\">2,5 % par an<\/mark> pendant t-weight=\"700\" class=\"tx\">an 2<\/text><rect x=\"118\" y=\"18\" width=\"22\" height=\"54\" class=\"k\" stroke-width=\"1.2\"/><text x=\"129\" y=\"84\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">an 3<\/text><text x=\"80\" y=\"18\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\" class=\"kt\">chaque année : + C × t<\/text><\/svg>","def":"Capital augmenté des intérêts.","formule":"A = C + I","phrase":"La valeur acquise est de 3 660 €."}]},{"id":"c5","n":5,"col":"fonction","icone":"📈","dom":"Algèbre – Analyse","titre":"Fonctions","intro":"Un tarif de livraison, une recette, l’affluence en magasin : une fonction relie deux grandeurs et se lit sur un graphique.","obj":["Calculer une image, un antécédent.","Reconnaître une fonction linéaire, une fonction affine.","Lire des variations, un maximum, résoudre graphiquement.","Utiliser la fonction carré et x ↦ kx²."],"auto":["imAff","imAff","lin","pctOf","eq1","imCar"],"lecons":[{"titre":"Image et antécédent","rule":"<p>Une fonction f associe à chaque nombre x un nombre noté <span class=\"fx\">f(x)<\/span> : c’est l’<span class=\"fx\">image<\/span> de x.<\/p><p>x est un <span class=\"fx\">antécédent<\/span> de f(x).<\/p><p>Trois façons de la donner : une expression, un tableau de valeurs, une courbe.<\/p>","ex":"<p>f(x) = 2x + 3<\/p><p>f(4) = 2 × 4 + 3 = <b>11<\/b> : 11 est l’image de 4 ; 4 est un antécédent de 11.<\/p>","ill":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" class=\"pic\"><rect x=\"8\" y=\"30\" width=\"40\" height=\"28\" rx=\"5\" class=\"k2 ks\" stroke-width=\"1.6\"/><text x=\"28\" y=\"47.96\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">x = 3<\/text><path d=\"M52 44H103\" class=\"ks\" stroke-width=\"2.2\" fill=\"none\"/><path d=\"M101 39L108 44L101 49Z\" class=\"k\"/><text x=\"80\" y=\"37\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"700\" class=\"kt\">f<\/text><rect x=\"112\" y=\"30\" width=\"40\" height=\"28\" rx=\"5\" class=\"k ks\" stroke-width=\"1.6\"/><text x=\"132\" y=\"47.6\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\" class=\"tw\">f(3) = 7<\/text><text x=\"30\" y=\"80\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">antécédent<\/text><text x=\"132\" y=\"80\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">image<\/text><\/svg>"},{"titre":"Fonction linéaire, proportionnalité","rule":"<p><span class=\"fx\">f(x) = ax<\/span> : situation de proportionnalité.<\/p><p>Sa courbe est une droite qui passe par l’origine.<\/p>","ex":"<p>Pommes à 1,80 € le kg : f(x) = 1,8x<\/p><p>f(3) = <b>5,40 €<\/b><\/p>"},{"titre":"Fonction affine","rule":"<p><span class=\"fx\">f(x) = ax + b<\/span> : sa courbe est une droite.<\/p><p><span class=\"fx\">a<\/span> : coefficient directeur (quand x augmente de 1, f(x) augmente de a). a = (y<sub>2<\/sub> − y<sub>1<\/sub>) ÷ (x<sub>2<\/sub> − x<sub>1<\/sub>).<\/p><p><span class=\"fx\">b<\/span> : ordonnée à l’origine. a &gt; 0 : croissante ; a &lt; 0 : décroissante.<\/p>","ex":"<p>Livraison : 5 € + 0,50 € par km<\/p><p>f(x) = 0,5x + 5 ; a = 0,5 ; b = 5<\/p><p>f(12) = <b>11 €<\/b><\/p>","ill":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" class=\"pic\"><line x1=\"16\" x2=\"150\" y1=\"76\" y2=\"76\" class=\"ks\" stroke-width=\"1.6\"/><line x1=\"24\" x2=\"24\" y1=\"8\" y2=\"84\" class=\"ks\" stroke-width=\"1.6\"/><line x1=\"16\" x2=\"146\" y1=\"66\" y2=\"14\" class=\"ks\" stroke-width=\"3\"/><circle cx=\"24\" cy=\"62.8\" r=\"4\" class=\"k\"/><text x=\"34\" y=\"56\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"700\" class=\"kt\">b<\/text><path d=\"M90 40H120V28\" class=\"ks\" stroke-width=\"1.6\" fill=\"none\" stroke-dasharray=\"3 2\"/><text x=\"128\" y=\"38\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"700\" class=\"kt\">a<\/text><\/svg>"},{"titre":"Fonction carré, x ↦ kx²","rule":"<p><span class=\"fx\">f(x) = x²<\/span> : courbe en forme de U (parabole), minimum 0 en x = 0 ; décroissante puis croissante.<\/p><p>x ↦ kx² : même forme ; si k &lt; 0, la courbe est retournée.<\/p><p>x ↦ f(x) + k : la courbe monte (k &gt; 0) ou descend de k.<\/p>","ex":"<p>Tapis carré à 25 € le m² : P(x) = 25x²<\/p><p>P(2) = 25 × 4 = <b>100 €<\/b><\/p>","ill":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" class=\"pic\"><line x1=\"10\" x2=\"150\" y1=\"80\" y2=\"80\" class=\"ks\" stroke-width=\"1.6\"/><line x1=\"80\" x2=\"80\" y1=\"6\" y2=\"86\" class=\"ks\" stroke-width=\"1.6\"/><path d=\"M20.0 16.0L23.0 22.2L26.0 28.2L29.0 33.8L32.0 39.0L35.0 44.0L38.0 48.6L41.0 53.0L44.0 57.0L47.0 60.6L50.0 64.0L53.0 67.0L56.0 69.8L59.0 72.2L62.0 74.2L65.0 76.0L68.0 77.4L71.0 78.6L74.0 79.4L77.0 79.8L80.0 80.0L83.0 79.8L86.0 79.4L89.0 78.6L92.0 77.4L95.0 76.0L98.0 74.2L101.0 72.2L104.0 69.8L107.0 67.0L110.0 64.0L113.0 60.6L116.0 57.0L119.0 53.0L122.0 48.6L125.0 44.0L128.0 39.0L131.0 33.8L134.0 28.2L137.0 22.2L140.0 16.0\" class=\"ks\" stroke-width=\"3\" fill=\"none\"/><text x=\"124\" y=\"22\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" class=\"kt\">x²<\/text><\/svg>"},{"titre":"Lire un graphique","rule":"<p><span class=\"fx\">Variations<\/span> : la courbe monte (croissante) ou descend (décroissante) ; on les résume dans un tableau de variations.<\/p><p><span class=\"fx\">f(x) = c<\/span> : abscisses des points de la courbe d’ordonnée c.<\/p><p>Deux droites : leur point d’intersection résout le <span class=\"fx\">système<\/span>.<\/p>","ex":"<p>Droites y = 0,8x et y = 0,3x + 12 :<\/p><p>elles se coupent en <b>(24 ; 19,2)<\/b>.<\/p>"}],"mots":[["image, antécédent","f(x) est l’image de x ; x est un antécédent de f(x)"],["fonction affine","f(x) = ax + b, courbe : une droite"],["coefficient directeur","a : variation de f(x) quand x augmente de 1"],["ordonnée à l’origine","b = f(0)"],["croissante, décroissante","la courbe monte ; la courbe descend"],["maximum, minimum","plus grande, plus petite valeur de f(x)"]],"ast ets, dont 5 gagnants :<\/p><p>P(gagner) = 5 ÷ 50 = <b>0,1<\/b> = 10 %<\/p>","ill":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" class=\"pic\"><circle cx=\"80\" cy=\"46\" r=\"36\" class=\"k2 ks\" stroke-width=\"1.6\"/><path d=\"M80 46V10A36 36 0 0 1 114.2 34.9Z\" class=\"k\"/><text x=\"80\" y=\"88\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">0 ≤ P ≤ 1<\/text><\/svg>"},{"titre":"Événement contraire","rule":"<p><span class=\"fx\">non A<\/span> (noté Ā) se réalise quand A ne se réalise pas.<\/p><p><span class=\"fx\">P(Ā) = 1 − P(A)<\/span><\/p>","ex":"<p>P(gagner) = 0,1<\/p><p>P(perdre) = 1 − 0,1 = <b>0,9<\/b><\/p>"},{"titre":"Dénombrer : tableau et arbre","rule":"<p>Deux épreuves : un <span class=\"fx\">tableau à double entrée<\/span> ou un <span class=\"fx\">arbre<\/span> liste toutes les issues.<\/p><p>Nombre d’issues = nombre de choix 1 × nombre de choix 2.<\/p>","ex":"<p>3 entrées et 2 plats : 3 × 2 = <b>6 menus<\/b><\/p><p>Deux dés : 6 × 6 = <b>36 issues<\/b><\/p>","ill":"<svg viewBox=\"0 0 160 90\" xmlns=\"http://www.w3.org/2000/svg\" class=\"pic\"><circle cx=\"18\" cy=\"46\" r=\"4\" class=\"k\"/><line x1=\"22\" y1=\"46\" x2=\"70\" y2=\"22\" class=\"ks\" stroke-width=\"1.8\"/><line x1=\"22\" y1=\"46\" x2=\"70\" y2=\"70\" class=\"ks\" stroke-width=\"1.8\"/><line x1=\"76\" y1=\"22\" x2=\"130\" y2=\"8\" class=\"ks\" stroke-width=\"1.4\"/><line x1=\"76\" y1=\"22\" x2=\"130\" y2=\"22\" class=\"ks\" stroke-width=\"1.4\"/><line x1=\"76\" y1=\"22\" x2=\"130\" y2=\"36\" class=\"ks\" stroke-width=\"1.4\"/><line x1=\"76\" y1=\"70\" x2=\"130\" y2=\"56\" class=\"ks\" stroke-width=\"1.4\"/><line x1=\"76\" y1=\"70\" x2=\"130\" y2=\"70\" class=\"ks\" stroke-width=\"1.4\"/><line x1=\"76\" y1=\"70\" x2=\"130\" y2=\"84\" class=\"ks\" stroke-width=\"1.4\"/><text x=\"70\" y=\"16\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"700\" class=\"tx\">A<\/text><text x=\"70\" y=\"84\" font-size=\"10\" text-anchor=\"middle\" font-weigh  vitrine, une vendeuse choisit <mark class=\"hl\">un haut parmi 3<\/mark> (blanc, bleu, rayé) et <mark class=\"hl\">un bas parmi 4<\/mark> (jean, noir, beige, short). Elle tire au hasard.<\/p>","outro":"","seq":[{"q":0},{"q":1},{"q":2}],"qs":[{"l":"a.","t":"Combien de tenues différentes peut-elle composer ?","a":"12","v":12,"tol":0},{"l":"b.","t":"Calculez la probabilité d’obtenir « haut rayé + jean ».","a":"1/12 ≈ 0,083","v":0.08333333333333333,"tol":0.001},{"l":"c.","t":"Calculez la probabilité d’obtenir un haut rayé.","a":"1/3 ≈ 0,333","v":0.3333333333333333,"tol":0.001}]},{"id":"p4","etape":2,"titre":"Python : simuler un jeu","lc":4,"corr":"a. Obtenir 6 au lancer d’un dé. b. La fréquence de 6 sur 1 000 lancers. c. Environ 1/6 ≈ 0,167 (le résultat change à chaque exécution).","intro":"<pre class=\"code py\">from random import randint\n\n<b>def<\/b> jeu(n):\n    gains = 0\n    <b>for<\/b> i <b>in<\/b> <b>range<\/b>(n):\n        <b>if<\/b> randint(1, 6) == 6:\n            gains = gains + 1\n    <b>return<\/b> gains / n\n\n<b>print<\/b>(jeu(1000))<\/pre><p class=\"small\"><code>randint(1, 6)<\/code> donne un entier au hasard entre 1 et 6.<\/p>","outro":"","seq":[{"q":0},{"q":1},{"q":2}],"qs":[{"l":"a.","t":"Que simule <code>randint(1, 6) == 6<\/code> ?","a":"obtenir 6 avec un dé","v":null,"tol":null},{"l":"b.","t":"Que renvoie <code>jeu(1000)<\/code> ?","a":"la fréquence des 6 sur 1 000 lancers","v":null,"tol":null},{"l":"c.","t":"De quel nombre le résultat est-il proche ? (au millième)","a":"0,167 (1/6)","v":0.16666666666666666,"tol":0.02}]},{"id":"c1","etape":3,"titre":"Le paiement sans contact","lc":4,"corr":"a. 0,55 et 0,66. b. 0,11. c. 6,05 ÷ 10 = 0,605. d. Oui, la probabilité est estimée à environ 0,6.","intro":"<p>Une enseigne relève, dans <mark class=\"hl\">10 échantillons de 100 clients<\/mark>, la fréquence des paiements sans contact.<\/p><div class=\"wfig\"><svg class=\"chart\" viewBox=\"0 0 640 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria
